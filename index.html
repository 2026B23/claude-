<title>CCAO-F 学習トレーナー(非公式)</title>
<style>
/* CCAO-F 学習トレーナー — スタイル(外部フォント・CDNなし) */
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #f1eee7;
  --text: #22201c;
  --muted: #6b665d;
  --border: #e2ddd2;
  --accent: #b5532c;
  --accent-weak: #f6e6dd;
  --accent-text: #ffffff;
  --good: #2f7d4f;
  --good-weak: #e3f2e8;
  --bad: #b33a3a;
  --bad-weak: #f8e4e4;
  --warn: #8a6100;
  --warn-weak: #fbf0d4;
  --info: #2c5d8a;
  --info-weak: #e3edf7;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18;
    --surface: #252320;
    --surface-2: #2e2b27;
    --text: #ece8e1;
    --muted: #a8a196;
    --border: #3a3631;
    --accent: #e07a4f;
    --accent-weak: #3b2a22;
    --accent-text: #1b1a18;
    --good: #6cc391;
    --good-weak: #1f3327;
    --bad: #ec8080;
    --bad-weak: #3a2222;
    --warn: #e6c062;
    --warn-weak: #3a3220;
    --info: #8dbbe6;
    --info-weak: #1f2c3a;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.75;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .choice:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- レイアウト ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
}
.brand {
  font-weight: 700; color: var(--text); text-decoration: none;
  white-space: nowrap; font-size: .95rem;
}
.brand .pill { margin-right: 6px; }
.nav {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  margin-left: auto;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  white-space: nowrap; text-decoration: none; color: var(--muted);
  padding: 6px 10px; border-radius: 8px; font-size: .88rem;
}
.nav a.active, .nav a:hover { background: var(--surface-2); color: var(--text); }

main { max-width: 900px; margin: 0 auto; padding: 16px 16px 40px; }
main:focus { outline: none; }
@media (max-width: 640px) {
  .topbar-inner { flex-wrap: wrap; gap: 4px 12px; padding: 6px 12px; }
  .nav { margin-left: 0; width: 100%; flex-wrap: wrap; overflow: visible; }
  .nav a { padding: 4px 8px; }
}

.page-head { margin: 8px 0 16px; }
.page-head h1 { font-size: 1.45rem; margin: 0 0 4px; line-height: 1.4; }
.page-head .sub { color: var(--muted); font-size: .9rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card.accent { border-color: var(--accent); }
.card h2 { font-size: 1.15rem; margin: 0 0 10px; line-height: 1.45; }
.card h3 { font-size: 1.02rem; margin: 18px 0 6px; line-height: 1.5; }
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }
.card ul, .card ol { margin: 4px 0 10px; padding-left: 1.4em; }
.card li { margin-bottom: 4px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

/* ---------- 部品 ---------- */
.pill {
  display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 999px;
  background: var(--accent); color: var(--accent-text);
  vertical-align: middle;
}
.badge {
  display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  vertical-align: middle; line-height: 1.6;
}
.badge.check { background: var(--warn-weak); color: var(--warn); border-color: transparent; font-weight: 700; }
.badge.ok { background: var(--good-weak); color: var(--good); border-color: transparent; }
.badge.domain { background: var(--accent-weak); color: var(--accent); border-color: transparent; font-weight: 700; }
.badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button, .btn {
  font: inherit; font-size: .92rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 8px 14px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  cursor: pointer; text-decoration: none; line-height: 1.4;
}
button:hover, .btn:hover { background: var(--surface-2); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
button.primary:hover, .btn.primary:hover { filter: brightness(1.05); }
button.ghost, .btn.ghost { background: transparent; }
button.small, .btn.small { min-height: 34px; padding: 4px 10px; font-size: .84rem; }
button:disabled, .btn.disabled { opacity: .45; cursor: not-allowed; }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }

input[type="search"], input[type="text"], select {
  font: inherit; font-size: 1rem;
  min-height: 42px; padding: 6px 10px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  width: 100%;
}
.filter-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
@media (max-width: 560px) { .filter-row { grid-template-columns: 1fr; } }

.note { font-size: .85rem; color: var(--muted); }
.callout {
  border-radius: 10px; padding: 10px 12px; margin: 10px 0;
  background: var(--info-weak); color: var(--text); font-size: .92rem;
}
.callout.warn { background: var(--warn-weak); }
.callout.good { background: var(--good-weak); }
.callout.bad { background: var(--bad-weak); }
.callout strong:first-child { margin-right: 4px; }

/* ドメインバー */
.domain-bars { display: grid; gap: 6px; margin: 8px 0; }
.dbar { display: grid; grid-template-columns: minmax(0, 13em) 1fr 3.4em; align-items: center; gap: 8px; font-size: .86rem; }
.dbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbar .track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.dbar .fill { height: 100%; background: var(--accent); border-radius: 999px; }
.dbar .fill.good { background: var(--good); }
.dbar .fill.bad { background: var(--bad); }
.dbar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
@media (max-width: 560px) {
  .dbar { grid-template-columns: 1fr 3.4em; row-gap: 2px; }
  .dbar .name { grid-column: 1 / -1; white-space: normal; }
}

/* 概要表 */
.kv { display: grid; grid-template-columns: 8.5em 1fr; gap: 0; border-top: 1px solid var(--border); }
.kv > div { padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: .9rem; }
.kv .k { color: var(--muted); font-weight: 700; }
@media (max-width: 560px) {
  .kv { grid-template-columns: 1fr; }
  .kv .k { border-bottom: none; padding-bottom: 0; }
}

details.fold { border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; margin: 10px 0; background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 10px 0; font-weight: 700; font-size: .92rem; list-style-position: inside; }
details.fold[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 8px; }
details.fold > .fold-body { padding-bottom: 10px; }

/* ---------- 教科書 ---------- */
.toc { display: grid; gap: 8px; }
.toc a {
  display: grid; grid-template-columns: 4.2em 1fr auto; gap: 8px; align-items: center;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  text-decoration: none; color: var(--text); background: var(--surface);
}
.toc a:hover { background: var(--surface-2); }
.toc .no { color: var(--accent); font-weight: 700; font-size: .9rem; }
.toc .w { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.chapter-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chapter-tabs a {
  white-space: nowrap; text-decoration: none; font-size: .82rem;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--surface);
}
.chapter-tabs a.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }

.block-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 1.08rem; font-weight: 700; margin: 0 0 10px;
}
.block-title .icon { font-size: 1.1rem; }
.section { padding: 12px 0; border-top: 1px dashed var(--border); }
.section:first-of-type { border-top: none; padding-top: 4px; }
.section h3 { margin: 0 0 6px; font-size: 1rem; }
.section .meta { margin-top: 6px; }
.obj-tag { font-size: .72rem; font-weight: 700; color: var(--accent); background: var(--accent-weak); padding: 1px 6px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }
.src { font-size: .78rem; color: var(--muted); }
.src a { color: var(--muted); }
.example {
  border-left: 4px solid var(--info); background: var(--info-weak);
  border-radius: 0 10px 10px 0; padding: 10px 12px; margin: 10px 0;
}
.example .scene { font-weight: 700; font-size: .9rem; margin-bottom: 4px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.compare > div { border-radius: 8px; padding: 8px 10px; font-size: .9rem; }
.compare .ng { background: var(--bad-weak); }
.compare .ok { background: var(--good-weak); }
.compare .lbl { font-weight: 700; font-size: .78rem; display: block; margin-bottom: 2px; }
@media (max-width: 560px) { .compare { grid-template-columns: 1fr; } }
.pitfall { padding: 10px 0; border-top: 1px dashed var(--border); }
.pitfall:first-of-type { border-top: none; }
.pitfall .wrong { font-weight: 700; color: var(--bad); }
.pitfall .wrong::before { content: "✗ "; }
.pitfall .right { margin-top: 4px; }
.pitfall .right::before { content: "→ "; color: var(--good); font-weight: 700; }
.checklist { list-style: none; padding-left: 0 !important; }
.checklist li { padding: 6px 0 6px 30px; position: relative; border-bottom: 1px dashed var(--border); }
.checklist li:last-child { border-bottom: none; }
.checklist li::before { content: "☐"; position: absolute; left: 4px; top: 5px; color: var(--accent); font-size: 1.05rem; }
table.simple { width: 100%; border-collapse: collapse; font-size: .88rem; margin: 8px 0; }
table.simple th, table.simple td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
table.simple th { background: var(--surface-2); }
.table-wrap { overflow-x: auto; }

/* ---------- 用語集 ---------- */
.term { padding: 10px 0; border-top: 1px dashed var(--border); }
.term:first-child { border-top: none; }
.term .t { font-weight: 700; }
.term .t .en { font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: 6px; }
.term .d { font-size: .93rem; margin-top: 2px; }
.term .rel { font-size: .8rem; color: var(--muted); margin-top: 4px; }

/* ---------- クイックリファレンス ---------- */
.qr { padding: 10px 0; border-top: 1px dashed var(--border); }
.qr:first-of-type { border-top: none; }
.qr .q { font-weight: 700; font-size: .95rem; }
.qr .q::before { content: "こう問われたら → "; color: var(--muted); font-weight: 400; font-size: .82rem; }
.qr .pick { margin-top: 4px; }
.qr .pick::before { content: "✅ 選ぶ: "; font-weight: 700; color: var(--good); }
.qr .avoid { margin-top: 2px; color: var(--muted); font-size: .9rem; }
.qr .avoid::before { content: "⛔ 避ける: "; font-weight: 700; color: var(--bad); }


/* ---------- 問題・模試 ---------- */
.quiz-bar {
  position: sticky; top: 52px; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); padding: 6px 0; font-size: .86rem; color: var(--muted);
}
@media (max-width: 640px) { .quiz-bar { top: 74px; } }
.quiz-bar .ql { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quiz-bar .qn { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
.timer.low { color: var(--bad); border-color: var(--bad); background: var(--bad-weak); }
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
.progress > div { height: 100%; background: var(--accent); transition: width .2s; }
.scenario { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin: 8px 0 10px; font-size: .95rem; }
.stem { font-weight: 700; margin: 6px 0 12px; }
.choices { display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: 2em 1fr auto; align-items: start; gap: 8px;
  width: 100%; text-align: left; min-height: 48px; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface);
  font-size: .95rem; line-height: 1.6; cursor: pointer; color: var(--text);
}
.choice:hover:not(:disabled) { background: var(--surface-2); }
.choice .key {
  display: inline-flex; align-items: center; justify-content: center;
  width: 1.8em; height: 1.8em; border-radius: 50%; border: 1.5px solid var(--border);
  font-weight: 700; font-size: .85rem; color: var(--muted);
}
.choice[role="checkbox"] .key { border-radius: 6px; }
.choice.selected { border-color: var(--accent); background: var(--accent-weak); }
.choice.selected .key { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.choice.correct { border-color: var(--good); background: var(--good-weak); opacity: 1; }
.choice.correct .key { background: var(--good); border-color: var(--good); color: #fff; }
.choice.incorrect { border-color: var(--bad); background: var(--bad-weak); opacity: 1; }
.choice.incorrect .key { background: var(--bad); border-color: var(--bad); color: #fff; }
.choice.muted { opacity: .75; }
.choice:disabled { cursor: default; }
.verdict-icon { font-weight: 700; font-size: 1.1rem; }
.choice.correct .verdict-icon { color: var(--good); }
.choice.incorrect .verdict-icon { color: var(--bad); }
.why { font-size: .86rem; margin: -2px 0 4px 2.6em; padding: 4px 0 4px 10px; border-left: 3px solid var(--border); color: var(--muted); }
.why.ok { border-color: var(--good); }
.why.ng { border-color: var(--bad); }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: .93rem; }
.explain p { margin: 4px 0; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.pal { min-height: 38px; padding: 0; font-size: .85rem; font-variant-numeric: tabular-nums; position: relative; }
.pal.ans { background: var(--accent-weak); border-color: var(--accent); }
.pal.cur { outline: 2px solid var(--text); outline-offset: 1px; }
.pal.flag::after { content: "🚩"; position: absolute; top: -6px; right: -4px; font-size: .7rem; }
.score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.score .big { font-size: 3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score .big.pass, td.pass { color: var(--good); }
.score .big.fail, td.fail { color: var(--bad); }
.rv > summary { font-weight: 400; }
.rv-ok > summary { color: var(--text); }
.rv-ng > summary { color: var(--bad); }
.rv-stem { color: var(--muted); font-size: .85rem; }
.rv-choice { display: grid; grid-template-columns: 2em 1fr; gap: 8px; padding: 8px; border-radius: 8px; margin: 4px 0; font-size: .92rem; }
.rv-choice.ok { background: var(--good-weak); }
.rv-choice.ng { background: var(--bad-weak); }
.rv-choice .key { font-weight: 700; color: var(--muted); }

/* ---------- フッター ---------- */
footer.site-footer {
  max-width: 900px; margin: 0 auto; padding: 18px 16px 32px;
  font-size: .8rem; color: var(--muted); border-top: 1px solid var(--border);
}
footer.site-footer p { margin: 0 0 6px; }

.empty { text-align: center; color: var(--muted); padding: 24px 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media print {
  .topbar, .btn-row, .chapter-tabs { display: none; }
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
}

</style>
</head>

<script>/* data/exam.js */
/*
 * CCAO-F 試験メタデータ

<script>/* js/storage.js */
/*
 * 学習履歴の保存(localStorage)
 * 問題は固定ID(例 "D2-001")で記録するため、データを差し替えても履歴はずれない。
 * 保存形式:
 *   { version:1,
 *     attempts:[{ id, mode, label, startedAt, finishedAt, durationSec, total, correct,
 *                 byDomain:{D1:{correct,total}}, items:[{qid, domain, correct}] }],
 *     qstats:{ "D2-001": { seen, correct, lastCorrect, lastAt } },
 *     inProgress: null | { ...模試の途中状態 } }
 */
(function () {
  const KEY = 'ccaof.v1';
  const empty = () => ({ version: 1, attempts: [], qstats: {}, inProgress: null });

  let memoryFallback = null; // localStorageが使えない環境(一部ブラウザのfile://等)用

  function available() {
    try {
      const t = '__ccaof_test__';
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      return true;
    } catch (e) {
      return false;
    }
  }
  const canPersist = available();

  function load() {
    if (!canPersist) return memoryFallback || (memoryFallback = empty());
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return empty();
      const data = JSON.parse(raw);
      return Object.assign(empty(), data);
    } catch (e) {
      return empty();
    }
  }

  function save(data) {
    if (!canPersist) { memoryFallback = data; return; }
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      alert('履歴を保存できませんでした(ブラウザの保存領域が不足している可能性があります)。');
    }
  }

  /** 1回分の演習・模試の結果を記録する */
  function recordAttempt(attempt) {
    const data = load();
    data.attempts.push(attempt);
    attempt.items.forEach(it => {
      const s = data.qstats[it.qid] || { seen: 0, correct: 0, lastCorrect: null, lastAt: null };
      s.seen += 1;
      if (it.correct) s.correct += 1;
      s.lastCorrect = !!it.correct;
      s.lastAt = attempt.finishedAt;
      data.qstats[it.qid] = s;
    });
    save(data);
  }

  /** 直近の回答が不正解の問題ID(=復習対象) */
  function wrongIds() {
    const q = load().qstats;
    return Object.keys(q).filter(id => q[id].lastCorrect === false);
  }

  /** ドメイン別の累積正答数(qstatsベースではなく全回答ベース) */
  function domainStats() {
    const out = {};
    load().attempts.forEach(a => {
      a.items.forEach(it => {
        const d = out[it.domain] || (out[it.domain] = { correct: 0, total: 0 });
        d.total += 1;
        if (it.correct) d.correct += 1;
      });
    });
    return out;
  }

  /** 苦手ドメイン: 回答数 minSamples 以上で正答率が threshold 未満。弱い順。 */
  function weakDomains(minSamples, threshold) {
    const st = domainStats();
    return Object.keys(st)
      .map(id => ({ id, correct: st[id].correct, total: st[id].total, acc: st[id].correct / st[id].total }))
      .filter(d => d.total >= minSamples && d.acc < threshold)
      .sort((a, b) => a.acc - b.acc);
  }

  function saveInProgress(obj) { const d = load(); d.inProgress = obj; save(d); }
  function loadInProgress() { return load().inProgress; }
  function clearInProgress() { const d = load(); d.inProgress = null; save(d); }

  function exportJson() {
    return JSON.stringify(Object.assign({ exportedAt: new Date().toISOString(), app: 'ccaof-trainer' }, load()), null, 2);
  }

  function importJson(text) {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.attempts) || typeof data.qstats !== 'object') {
      throw new Error('形式が正しくありません');
    }
    // 読み込むファイルは信頼できない入力として扱い、想定した型・形式だけを取り込む
    const int = v => (Number.isInteger(Number(v)) ? Number(v) : 0);
    const str = (v, max) => String(v == null ? '' : v).slice(0, max || 200);
    const idOk = v => /^[A-Za-z0-9_-]{1,40}$/.test(String(v));
    const intArr = v => (Array.isArray(v) ? v.map(int).filter(n => n >= 0 && n < 10).slice(0, 10) : []);
    const attempts = data.attempts.slice(0, 2000).map(a => ({
      id: idOk(a.id) ? String(a.id) : 'a' + Math.random().toString(36).slice(2),
      mode: a.mode === 'mock' ? 'mock' : 'practice',
      kind: str(a.kind, 20), label: str(a.label, 120), param: idOk(a.param) ? String(a.param) : null,
      startedAt: str(a.startedAt, 40), finishedAt: str(a.finishedAt, 40),
      durationSec: int(a.durationSec), timeUp: !!a.timeUp,
      total: int(a.total), correct: int(a.correct),
      byDomain: Object.fromEntries(Object.entries(a.byDomain || {}).filter(([k]) => /^D[1-9]$/.test(k))
        .map(([k, v]) => [k, { correct: int(v && v.correct), total: int(v && v.total) }])),
      items: (Array.isArray(a.items) ? a.items : []).filter(it => it && idOk(it.qid) && /^D[1-9]$/.test(it.domain)).slice(0, 200)
        .map(it => ({ qid: String(it.qid), domain: String(it.domain), correct: !!it.correct, selected: intArr(it.selected), order: intArr(it.order) }))
    })).filter(a => a.total > 0 && a.items.length);
    const qstats = {};
    Object.entries(data.qstats || {}).forEach(([k, v]) => {
      if (idOk(k) && v) qstats[k] = { seen: int(v.seen), correct: int(v.correct), lastCorrect: v.lastCorrect === true ? true : v.lastCorrect === false ? false : null, lastAt: str(v.lastAt, 40) };
    });
    save({ version: 1, attempts, qstats, inProgress: null });
  }

  function reset() { save(empty()); }

  window.CCAOF = window.CCAOF || {};
  CCAOF.store = {
    canPersist, load, save, recordAttempt, wrongIds, domainStats, weakDomains,
    saveInProgress, loadInProgress, clearInProgress, exportJson, importJson, reset
  };
})();

</script>
<script>/* js/quiz.js */
/*
 * 出題・採点エンジン
 *   練習モード: 章別 / 自由演習 / 苦手ドメイン / 間違えた問題の復習(回答ごとに解説を表示)
 *   模試モード: 30問ミニ模試(60分) / 60問模試(120分・本番配分)(最後にまとめて採点)
 * セッションは localStorage に保存し、再読み込みしても続きから再開できる。
 */
(function () {
  const C = window.CCAOF;
  const S = C.store;
  const U = () => C.ui; // app.js 読み込み後に参照

  const PASS = C.exam.passLinePct;
  let lastResult = null;     // 直近の結果(結果画面用)
  let timerHandle = null;

  /* ---------- 基本ユーティリティ ---------- */
  const qById = id => C.questions.find(q => q.id === id);
  const byDomain = id => C.questions.filter(q => q.domain === id);
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }
  const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const correctIdx = q => q.choices.map((c, i) => c.correct ? i : -1).filter(i => i >= 0);
  const isCorrect = (q, sel) => !!sel && sameSet(sel, correctIdx(q));
  const fmtTime = sec => {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
  };
  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  /* 出題の選び方: ドメインごとに、回答回数の少ない問題を優先してランダムに選ぶ */
  function pickFromDomain(domainId, n, exclude) {
    const qs = S.load().qstats;
    const pool = byDomain(domainId).filter(q => !(exclude && exclude.has(q.id)));
    const ranked = shuffle(pool).sort((a, b) => ((qs[a.id] || {}).seen || 0) - ((qs[b.id] || {}).seen || 0));
    return ranked.slice(0, n).map(q => q.id);
  }

  function poolEnough(key) {
    return C.exam.domains.every(d => byDomain(d.id).length >= d[key]);
  }

  /* ---------- セッション ---------- */
  function newSession(opts) {
    const orders = {};
    opts.qids.forEach(id => { orders[id] = shuffle(qById(id).choices.map((c, i) => i)); });
    const s = {
      v: 1,
      mode: opts.mode,              // 'practice' | 'mock'
      kind: opts.kind,              // 'domain' | 'free' | 'weak' | 'wrong' | 'mini' | 'full'
      label: opts.label,
      param: opts.param || null,
      qids: opts.qids,
      orders,
      answers: {},                  // qid -> 元の選択肢インデックス配列
      revealed: {},                 // 練習: 回答済み(解説表示)
      flags: {},                    // 模試: 見直しマーク
      index: 0,
      startedAt: Date.now(),
      deadline: opts.minutes ? Date.now() + opts.minutes * 60000 : null,
      minutes: opts.minutes || null,
      palette: false
    };
    return s;
  }
  const getSession = () => S.loadInProgress();
  const saveSession = s => S.saveInProgress(s);

  function startSession(opts) {
    const cur = getSession();
    if (cur && !confirm(`中断中の「${cur.label}」があります。破棄して新しく始めますか?`)) {
      location.hash = '#/quiz';
      return;
    }
    if (!opts.qids.length) { alert('出題できる問題がありません。'); location.hash = '#/practice'; return; }
    saveSession(newSession(opts));
    location.replace('#/quiz');
  }

  /* 開始ルート: #/practice/<kind>/<param> */
  function startFromRoute(kind, param, query) {
    const d = param ? U().domainById(param) : null;
    if (kind === 'domain' && d) {
      return startSession({ mode: 'practice', kind, param, label: `章別演習: ${d.no}. ${d.nameJa}`, qids: shuffle(byDomain(d.id)).map(q => q.id) });
    }
    if (kind === 'free') {
      const n = Number(query.n) || 20;
      const dom = query.d || '';
      const onlyNew = query.u === '1';
      const qs = S.load().qstats;
      let pool = C.questions.filter(q => (!dom || q.domain === dom) && (!onlyNew || !qs[q.id]));
      let qids;
      if (!dom && !onlyNew && n < pool.length) {
        // 全ドメインからなら配分比率に沿って抽出
        qids = proportional(n);
      } else {
        qids = shuffle(pool).slice(0, n).map(q => q.id);
      }
      const label = `自由演習: ${dom ? U().domainById(dom).nameJa : '全ドメイン'}${onlyNew ? '(未回答のみ)' : ''} ${qids.length}問`;
      return startSession({ mode: 'practice', kind, label, qids: shuffle(qids) });
    }
    if (kind === 'weak') {
      const weak = S.weakDomains(5, PASS / 100);
      if (!weak.length) { alert('苦手ドメインの判定には、各ドメイン5問以上の回答履歴が必要です。'); location.hash = '#/practice'; return; }
      const ids = new Set(weak.map(w => w.id));
      const wrong = new Set(S.wrongIds());
      // 苦手ドメインの問題を、間違えた問題→未回答→その他 の順に優先して最大20問
      const qs = S.load().qstats;
      const pool = shuffle(C.questions.filter(q => ids.has(q.domain)))
        .sort((a, b) => rank(a) - rank(b));
      function rank(q) { return wrong.has(q.id) ? 0 : !qs[q.id] ? 1 : 2; }
      const names = weak.map(w => U().domainById(w.id).short).join('・');
      return startSession({ mode: 'practice', kind, label: `苦手ドメイン演習: ${names}`, qids: shuffle(pool.slice(0, 20).map(q => q.id)) });
    }
    if (kind === 'wrong') {
      const ids = S.wrongIds().filter(id => qById(id));
      return startSession({ mode: 'practice', kind, label: `間違えた問題の復習 ${ids.length}問`, qids: shuffle(ids) });
    }
    if (kind === 'mini' && poolEnough('mini')) {
      const qids = C.exam.domains.flatMap(d => pickFromDomain(d.id, d.mini));
      return startSession({ mode: 'mock', kind, label: '30問ミニ模試', qids: shuffle(qids), minutes: 60 });
    }
    if (kind === 'full' && poolEnough('mock')) {
      const qids = C.exam.domains.flatMap(d => pickFromDomain(d.id, d.mock));
      return startSession({ mode: 'mock', kind, label: '60問模試(本番形式)', qids: shuffle(qids), minutes: C.exam.minutes });
    }
    location.replace('#/practice');
  }

  /* 全ドメインから配分比率で n 問 */
  function proportional(n) {
    const doms = C.exam.domains;
    const raw = doms.map(d => ({ d, x: d.weight / 100 * n }));
    raw.forEach(r => { r.k = Math.min(Math.floor(r.x), byDomain(r.d.id).length); });
    let left = n - raw.reduce((s, r) => s + r.k, 0);
    raw.slice().sort((a, b) => (b.x - b.k) - (a.x - a.k)).forEach(r => {
      if (left > 0 && r.k < byDomain(r.d.id).length) { r.k++; left--; }
    });
    return raw.flatMap(r => pickFromDomain(r.d.id, r.k));
  }

  /* ---------- 演習メニュー ---------- */
  function renderMenu(app) {
    const u = U();
    const total = C.questions.length;
    const st = S.load();
    const wrong = S.wrongIds().filter(id => qById(id)).length;
    const weak = S.weakDomains(5, PASS / 100);
    const cur = getSession();
    const miniOk = poolEnough('mini');
    const fullOk = poolEnough('mock');

    const resume = cur ? `<div class="card accent">
        <div class="badge-row"><span class="pill">中断中</span></div>
        <p><strong>${u.esc(cur.label)}</strong> — ${Object.keys(cur.answers).length} / ${cur.qids.length}問 回答済み${cur.deadline ? `・残り ${fmtTime((cur.deadline - Date.now()) / 1000)}` : ''}</p>
        <div class="btn-row"><a class="btn primary" href="#/quiz">続きから再開</a><button class="btn danger" id="discard">破棄する</button></div>
        ${cur.deadline ? '<p class="note">模試のタイマーは中断中も進みます(本番と同じく、開始からの経過時間で計測)。</p>' : ''}
      </div>` : '';

    const domRows = C.exam.domains.map(d => {
      const n = byDomain(d.id).length;
      return `<a class="btn ${n ? '' : 'disabled'}" ${n ? `href="#/practice/domain/${d.id}"` : 'aria-disabled="true"'} style="justify-content:space-between">
        <span>${d.no}. ${u.esc(d.nameJa)}</span><span class="badge">${n}問</span></a>`;
    }).join('');

    const domOpts = ['<option value="">全ドメイン(配分比率で抽出)</option>']
      .concat(C.exam.domains.map(d => `<option value="${d.id}">${d.no}. ${u.esc(d.nameJa)}</option>`)).join('');

    app.innerHTML = `
      <div class="page-head">
        <h1>✍️ 演習</h1>
        <div class="sub">オリジナル問題 ${total}問(実際の試験問題ではありません)。単一選択と複数選択(選ぶ数を明示)があります。</div>
      </div>
      ${resume}
      <div class="grid-2">
        <div class="card">
          <h2>📝 模試</h2>
          <p class="note">最後にまとめて採点します。見直しマーク・問題一覧から移動できます。</p>
          <div class="btn-row" style="flex-direction:column;align-items:stretch">
            <a class="btn ${miniOk ? 'primary' : 'disabled'}" ${miniOk ? 'href="#/practice/mini"' : 'aria-disabled="true"'}>30問ミニ模試(60分)</a>
            <a class="btn ${fullOk ? 'primary' : 'disabled'}" ${fullOk ? 'href="#/practice/full"' : 'aria-disabled="true"'}>60問模試(120分・本番配分)</a>
          </div>
          ${fullOk ? '' : '<p class="note">60問模試は問題が90問そろうフェーズ2-Bで有効になります。</p>'}
          <p class="note">60問模試の配分: ${C.exam.domains.map(d => `D${d.no}=${d.mock}`).join(' / ')}</p>
        </div>
        <div class="card">
          <h2>🎯 弱点対策</h2>
          <div class="btn-row" style="flex-direction:column;align-items:stretch">
            <a class="btn ${weak.length ? '' : 'disabled'}" ${weak.length ? 'href="#/practice/weak"' : 'aria-disabled="true"'}>苦手ドメイン演習${weak.length ? `(${weak.map(w => 'D' + u.domainById(w.id).no).join('・')})` : ''}</a>
            <a class="btn ${wrong ? '' : 'disabled'}" ${wrong ? 'href="#/practice/wrong"' : 'aria-disabled="true"'}>間違えた問題の復習(${wrong}問)</a>
          </div>
          <p class="note">苦手ドメイン = 5問以上回答し、正答率が${PASS}%未満のドメイン。間違えた問題 = 直近の回答が不正解の問題(正解すると外れます)。</p>
        </div>
      </div>
      <div class="card">
        <h2>📖 章別(ドメイン別)演習</h2>
        <p class="note">1問ごとに正誤と、選択肢ごとの解説を表示します。</p>
        <div style="display:grid;gap:8px">${domRows}</div>
      </div>
      <div class="card">
        <h2>🔀 自由演習</h2>
        <div class="filter-row" style="grid-template-columns:1fr 1fr">
          <label>問題数<select id="f-n"><option>10</option><option selected>20</option><option>30</option><option value="999">全問</option></select></label>
          <label>ドメイン<select id="f-d">${domOpts}</select></label>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="f-u"> まだ解いていない問題だけ</label>
        <div class="btn-row"><button class="primary" id="f-go">開始</button></div>
      </div>
      <p class="note">回答の記録はこのブラウザにのみ保存されます。これまでの演習: ${st.attempts.length}回。<a href="#/stats">成績を見る</a></p>`;

    const dis = document.getElementById('discard');
    if (dis) dis.onclick = () => { if (confirm('中断中の演習を破棄しますか?(回答は記録されません)')) { S.clearInProgress(); renderMenu(app); } };
    document.getElementById('f-go').onclick = () => {
      const n = document.getElementById('f-n').value;
      const d = document.getElementById('f-d').value;
      const uo = document.getElementById('f-u').checked ? '1' : '0';
      location.hash = `#/practice/free?n=${n}&d=${d}&u=${uo}`;
    };
  }

  /* ---------- 問題画面 ---------- */
  function renderQuiz(app) {
    const u = U();
    const s = getSession();
    if (!s) { location.replace('#/practice'); return; }
    // 既に削除された問題IDを除外(データ更新への備え)
    s.qids = s.qids.filter(id => qById(id));
    if (!s.qids.length) { S.clearInProgress(); location.replace('#/practice'); return; }
    s.index = Math.min(s.index, s.qids.length - 1);

    if (s.mode === 'mock' && s.deadline && Date.now() >= s.deadline) { finish(true); return; }

    const qid = s.qids[s.index];
    const q = qById(qid);
    const d = u.domainById(q.domain);
    const order = s.orders[qid] || q.choices.map((c, i) => i);
    const sel = s.answers[qid] || [];
    const revealed = s.mode === 'practice' && s.revealed[qid];
    const multi = q.type === 'multi';
    const answeredCount = Object.keys(s.answers).filter(k => (s.answers[k] || []).length).length;

    const choices = order.map((orig, pos) => {
      const c = q.choices[orig];
      const on = sel.includes(orig);
      let cls = 'choice';
      if (on) cls += ' selected';
      if (revealed) cls += c.correct ? ' correct' : (on ? ' incorrect' : ' muted');
      return `<button class="${cls}" data-orig="${orig}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${on}" ${revealed ? 'disabled' : ''}>
        <span class="key">${LETTERS[pos]}</span>
        <span class="ctext">${c.text}</span>
        ${revealed ? `<span class="verdict-icon">${c.correct ? '✓' : (on ? '✗' : '')}</span>` : ''}
      </button>
      ${revealed ? `<div class="why ${c.correct ? 'ok' : 'ng'}"><strong>${c.correct ? '正解の理由' : '誤りの理由'}:</strong> ${c.why}</div>` : ''}`;
    }).join('');

    let feedback = '';
    if (revealed) {
      const ok = isCorrect(q, sel);
      feedback = `<div class="callout ${ok ? 'good' : 'bad'}"><strong>${ok ? '✓ 正解' : '✗ 不正解'}</strong>
        ${!ok ? `正解は ${order.map((o, p) => q.choices[o].correct ? LETTERS[p] : null).filter(Boolean).join('・')} です。` : ''}</div>
        ${q.explanation ? `<div class="explain"><strong>解説</strong><p>${q.explanation}</p>
          <p class="note">関連: ${u.objTag(q.objective)}<a href="#/textbook/${d.no}">第${d.no}章 ${u.esc(d.nameJa)}</a>${q.sourceRefs && q.sourceRefs.length ? ' · ' + u.srcLinks(q.sourceRefs) : ''}</p></div>` : ''}`;
    }

    const need = q.select;
    const canSubmit = multi ? sel.length === need : sel.length === 1;
    const isLast = s.index === s.qids.length - 1;

    let actions;
    if (s.mode === 'practice') {
      actions = !revealed
        ? `<button class="primary" id="submit" ${canSubmit ? '' : 'disabled'}>回答する</button>`
        : (isLast ? `<button class="primary" id="finish">結果を見る</button>` : `<button class="primary" id="next">次の問題へ →</button>`);
      actions += `<button class="ghost" id="quit">${revealed && !isLast ? 'ここで終了して結果を見る' : '中断'}</button>`;
    } else {
      actions = `${s.index > 0 ? '<button id="prev">← 前へ</button>' : ''}
        ${!isLast ? '<button class="primary" id="next">次へ →</button>' : '<button class="primary" id="finish">採点する</button>'}
        <button class="ghost" id="flag">${s.flags[qid] ? '🚩 見直しマークを外す' : '🏳 見直しマーク'}</button>`;
    }

    const palette = s.mode === 'mock' ? `<details class="fold" ${s.palette ? 'open' : ''} id="palette-wrap">
        <summary>問題一覧(回答済み ${answeredCount}/${s.qids.length}・見直し ${Object.values(s.flags).filter(Boolean).length})</summary>
        <div class="fold-body"><div class="palette">${s.qids.map((id, i) => {
          const a = (s.answers[id] || []).length;
          return `<button class="pal ${i === s.index ? 'cur' : ''} ${a ? 'ans' : ''} ${s.flags[id] ? 'flag' : ''}" data-go="${i}" aria-label="問${i + 1}${a ? ' 回答済み' : ' 未回答'}${s.flags[id] ? ' 見直し' : ''}">${i + 1}</button>`;
        }).join('')}</div>
        <p class="note">■ 回答済み ・ 🚩 見直し ・ 枠 = 表示中</p>
        <div class="btn-row"><button class="primary small" id="finish2">採点する</button><button class="ghost small" id="suspend">中断してメニューへ</button></div></div>
      </details>` : '';

    app.innerHTML = `
      <div class="quiz-bar">
        <span class="ql">${u.esc(s.label)}</span>
        <span class="qn">${s.index + 1} / ${s.qids.length}</span>
        ${s.deadline ? `<span class="timer" id="timer">⏱ ${fmtTime((s.deadline - Date.now()) / 1000)}</span>` : ''}
      </div>
      <div class="progress"><div style="width:${(s.mode === 'mock' ? answeredCount : s.index + (revealed ? 1 : 0)) / s.qids.length * 100}%"></div></div>
      <div class="card">
        <div class="badge-row">
          <span class="badge domain">D${d.no} ${u.esc(d.short)}</span>
          ${multi ? `<span class="badge check">複数選択: ${need}つ選ぶ</span>` : '<span class="badge">単一選択</span>'}
          ${s.flags[qid] ? '<span class="badge">🚩 見直し</span>' : ''}
        </div>
        ${q.scenario ? `<div class="scenario">${q.scenario}</div>` : ''}
        <div class="stem">${q.stem}</div>
        <div class="choices" role="${multi ? 'group' : 'radiogroup'}">${choices}</div>
        ${multi && !revealed ? `<p class="note">${sel.length} / ${need} 選択中</p>` : ''}
        ${feedback}
        <div class="btn-row">${actions}</div>
      </div>
      ${palette}
      ${s.mode === 'mock' ? '<p class="note">模試では採点まで正誤は表示されません。本番と同じく、各問で選ぶ数が明示されています。</p>' : ''}`;

    /* イベント */
    app.querySelectorAll('.choice').forEach(btn => btn.onclick = () => choose(Number(btn.dataset.orig)));
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('submit', () => { s.revealed[qid] = true; saveSession(s); renderQuiz(app); });
    on('next', () => { s.index++; saveSession(s); renderQuiz(app); window.scrollTo(0, 0); });
    on('prev', () => { s.index--; saveSession(s); renderQuiz(app); window.scrollTo(0, 0); });
    on('flag', () => { s.flags[qid] = !s.flags[qid]; saveSession(s); renderQuiz(app); });
    on('finish', () => confirmFinish(s));
    on('finish2', () => confirmFinish(s));
    on('suspend', () => { location.hash = '#/practice'; });
    on('quit', () => {
      const answered = Object.keys(s.revealed).length;
      if (answered && confirm(`ここまでの ${answered}問で採点して終了しますか?\n(キャンセルすると中断して、あとで再開できます)`)) finish(false);
      else if (!answered || confirm('中断してメニューに戻りますか?(あとで再開できます)')) location.hash = '#/practice';
    });
    app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { s.index = Number(b.dataset.go); s.palette = true; saveSession(s); renderQuiz(app); });
    const pw = document.getElementById('palette-wrap');
    if (pw) pw.addEventListener('toggle', () => { s.palette = pw.open; saveSession(s); });

    function choose(orig) {
      if (revealed) return;
      let cur = (s.answers[qid] || []).slice();
      if (multi) {
        if (cur.includes(orig)) cur = cur.filter(x => x !== orig);
        else if (cur.length < need) cur.push(orig);
        else { cur.shift(); cur.push(orig); } // 上限に達したら古い選択と入れ替え
      } else {
        cur = [orig];
      }
      s.answers[qid] = cur;
      saveSession(s);
      renderQuiz(app);
    }

    startTimer(s);
  }

  function confirmFinish(s) {
    const un = s.qids.filter(id => !(s.answers[id] || []).length).length;
    const fl = Object.values(s.flags).filter(Boolean).length;
    let msg = '採点しますか?';
    if (un) msg += `\n未回答が ${un}問あります(不正解として扱います)。`;
    if (fl) msg += `\n見直しマークが ${fl}問あります。`;
    if (confirm(msg)) finish(false);
  }

  function startTimer(s) {
    stopTimer();
    if (!s.deadline) return;
    timerHandle = setInterval(() => {
      const el = document.getElementById('timer');
      const left = (s.deadline - Date.now()) / 1000;
      if (!el || location.hash !== '#/quiz') { stopTimer(); return; }
      el.textContent = '⏱ ' + fmtTime(left);
      el.classList.toggle('low', left <= 600);
      if (left <= 0) { stopTimer(); alert('制限時間になりました。採点します。'); finish(true); }
    }, 1000);
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  /* ---------- 採点 ---------- */
  function finish(timeUp) {
    stopTimer();
    const s = getSession();
    if (!s) return;
    const targets = s.mode === 'practice' ? s.qids.filter(id => s.revealed[id]) : s.qids;
    const items = targets.map(id => {
      const q = qById(id);
      const sel = s.answers[id] || [];
      return { qid: id, domain: q.domain, correct: isCorrect(q, sel), selected: sel, order: s.orders[id] };
    });
    if (!items.length) { S.clearInProgress(); location.hash = '#/practice'; return; }
    const byDom = {};
    items.forEach(it => {
      const b = byDom[it.domain] || (byDom[it.domain] = { correct: 0, total: 0 });
      b.total++; if (it.correct) b.correct++;
    });
    const now = Date.now();
    const attempt = {
      id: 'a' + now,
      mode: s.mode, kind: s.kind, label: s.label,
      startedAt: new Date(s.startedAt).toISOString(),
      finishedAt: new Date(now).toISOString(),
      durationSec: Math.round((Math.min(now, s.deadline || now) - s.startedAt) / 1000),
      timeUp: !!timeUp,
      total: items.length,
      correct: items.filter(i => i.correct).length,
      byDomain: byDom,
      items
    };
    S.recordAttempt(attempt);
    S.clearInProgress();
    lastResult = attempt;
    location.hash = '#/results';
  }

  /* ---------- 結果画面 ---------- */
  function renderResults(app, attemptId) {
    const u = U();
    const st = S.load();
    const a = attemptId ? st.attempts.find(x => x.id === attemptId) : (lastResult || st.attempts[st.attempts.length - 1]);
    if (!a) { location.replace('#/practice'); return; }
    const pct = Math.round(a.correct / a.total * 100);
    const pass = pct >= PASS;
    const bars = u.domainBars(C.exam.domains.filter(d => a.byDomain[d.id]).map(d => {
      const b = a.byDomain[d.id];
      const p = Math.round(b.correct / b.total * 100);
      return { name: `${d.no}. ${d.nameJa}`, title: d.nameEn, pct: p, cls: p >= PASS ? 'good' : 'bad', label: `${b.correct}/${b.total}` };
    }));

    const reviewItems = a.items.map((it, i) => {
      const q = qById(it.qid);
      if (!q) return '';
      const d = u.domainById(q.domain);
      const valid = Array.isArray(it.order) && it.order.length === q.choices.length && it.order.every(o => q.choices[o]);
      const order = valid ? it.order : q.choices.map((c, k) => k);
      const ch = order.map((orig, pos) => {
        const c = q.choices[orig];
        const on = (it.selected || []).includes(orig);
        return `<div class="rv-choice ${c.correct ? 'ok' : (on ? 'ng' : '')}">
          <span class="key">${LETTERS[pos]}</span><div><div>${c.text} ${c.correct ? '<span class="badge ok">正解</span>' : ''} ${on ? '<span class="badge">あなたの回答</span>' : ''}</div>
          <div class="note">${c.why}</div></div></div>`;
      }).join('');
      return `<details class="fold rv ${it.correct ? 'rv-ok' : 'rv-ng'}" data-ok="${it.correct}">
        <summary>${it.correct ? '✓' : '✗'} 問${i + 1} <span class="badge domain">D${d.no}</span> ${q.type === 'multi' ? `<span class="badge">${q.select}つ選ぶ</span>` : ''} <span class="rv-stem">${u.esc(stripTags(q.stem)).slice(0, 60)}</span></summary>
        <div class="fold-body">
          ${q.scenario ? `<div class="scenario">${q.scenario}</div>` : ''}
          <div class="stem">${q.stem}</div>
          ${(it.selected || []).length ? '' : '<div class="callout bad">未回答</div>'}
          ${ch}
          ${q.explanation ? `<div class="explain"><strong>解説</strong><p>${q.explanation}</p></div>` : ''}
          <p class="note">${u.objTag(q.objective)}<a href="#/textbook/${d.no}">第${d.no}章 ${u.esc(d.nameJa)}を読む</a></p>
        </div></details>`;
    }).join('');

    const wrongN = a.items.filter(i => !i.correct).length;
    const retry = a.kind === 'domain' ? `#/practice/domain/${a.param || ''}` : a.kind === 'mini' ? '#/practice/mini' : a.kind === 'full' ? '#/practice/full' : '#/practice';

    app.innerHTML = `
      <div class="page-head"><h1>結果 — ${u.esc(a.label)}</h1>
        <div class="sub">${new Date(a.finishedAt).toLocaleString('ja-JP')}${a.mode === 'mock' ? ` · 所要 ${fmtTime(a.durationSec)}` : ''}${a.timeUp ? ' · 時間切れ' : ''}</div></div>
      <div class="card">
        <div class="score">
          <div class="big ${pass ? 'pass' : 'fail'}">${pct}%</div>
          <div>${a.correct} / ${a.total} 問正解<br><strong>${pass ? `目安の${PASS}%に届いています` : `目安の${PASS}%まであと ${Math.max(0, Math.ceil(PASS / 100 * a.total) - a.correct)}問`}</strong></div>
        </div>
        <p class="note">※ 本番はスケールスコア(100〜1,000、合格720)で採点されます。ここでの${PASS}%は本サイト独自の簡易的な目安で、公式の換算ではありません。</p>
      </div>
      <div class="card"><h2>ドメイン別の正答率</h2>${bars}
        <p class="note">本番のスコアレポートにも、ドメイン別の正答率が表示されます(合否判定には使われません)。</p></div>
      <div class="card">
        <h2>全問の解説</h2>
        <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="only-ng" ${wrongN ? '' : 'disabled'}> 間違えた問題だけ表示(${wrongN}問)</label>
        <div id="rv-list">${reviewItems}</div>
      </div>
      <div class="btn-row">
        <a class="btn primary" href="${retry}">もう一度</a>
        ${wrongN ? '<a class="btn" href="#/practice/wrong">間違えた問題を復習</a>' : ''}
        <a class="btn" href="#/stats">成績を見る</a>
        <a class="btn ghost" href="#/practice">演習メニュー</a>
      </div>`;
    const cb = document.getElementById('only-ng');
    cb.onchange = () => app.querySelectorAll('.rv').forEach(el => { el.style.display = cb.checked && el.dataset.ok === 'true' ? 'none' : ''; });
  }
  const stripTags = s => String(s).replace(/<[^>]+>/g, '');

  /* ---------- 成績画面 ---------- */
  function renderStats(app) {
    const u = U();
    const st = S.load();
    const ds = S.domainStats();
    const qs = st.qstats;
    const seen = C.questions.filter(q => qs[q.id]).length;
    const wrong = S.wrongIds().filter(id => qById(id)).length;
    const weak = S.weakDomains(5, PASS / 100);

    const bars = u.domainBars(C.exam.domains.map(d => {
      const b = ds[d.id];
      const p = b ? Math.round(b.correct / b.total * 100) : 0;
      return { name: `${d.no}. ${d.nameJa}`, title: d.nameEn, pct: p, cls: !b ? '' : p >= PASS ? 'good' : 'bad', label: b ? `${p}%` : '—' };
    }));
    const detail = C.exam.domains.map(d => {
      const b = ds[d.id];
      const pool = byDomain(d.id);
      const seenD = pool.filter(q => qs[q.id]).length;
      return `<tr><td>${d.no}. ${u.esc(d.nameJa)}</td><td>${d.weight}%</td><td>${b ? `${b.correct}/${b.total}` : '—'}</td><td>${seenD}/${pool.length}</td></tr>`;
    }).join('');

    const hist = st.attempts.slice().reverse().slice(0, 30).map(a => {
      const p = Math.round(a.correct / a.total * 100);
      return `<tr><td>${new Date(a.finishedAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
        <td><a href="#/results/${encodeURIComponent(a.id)}">${u.esc(a.label)}</a></td><td>${a.correct}/${a.total}</td>
        <td class="${p >= PASS ? 'pass' : 'fail'}">${p}%</td></tr>`;
    }).join('');

    const mocks = st.attempts.filter(a => a.mode === 'mock');
    const best = mocks.length ? Math.max(...mocks.map(a => Math.round(a.correct / a.total * 100))) : null;

    app.innerHTML = `
      <div class="page-head"><h1>📊 成績</h1><div class="sub">このブラウザに保存された記録です。</div></div>
      ${!S.canPersist ? '<div class="callout warn"><strong>注意</strong>このブラウザでは記録を保存できない設定になっています。ページを閉じると記録は消えます。</div>' : ''}
      <div class="grid-2">
        <div class="card"><h2>概要</h2>
          <div class="kv">
            <div class="k">演習・模試</div><div>${st.attempts.length}回(うち模試 ${mocks.length}回${best !== null ? `・最高 ${best}%` : ''})</div>
            <div class="k">解いた問題</div><div>${seen} / ${C.questions.length}問</div>
            <div class="k">復習待ち</div><div>${wrong}問 ${wrong ? '<a href="#/practice/wrong">復習する</a>' : ''}</div>
            <div class="k">苦手ドメイン</div><div>${weak.length ? weak.map(w => `D${u.domainById(w.id).no} ${u.esc(u.domainById(w.id).short)}(${Math.round(w.acc * 100)}%)`).join('、') + ' <a href="#/practice/weak">演習する</a>' : '該当なし(各ドメイン5問以上の回答で判定)'}</div>
          </div>
        </div>
        <div class="card"><h2>ドメイン別 累積正答率</h2>${bars}<p class="note">緑 = ${PASS}%以上、赤 = ${PASS}%未満</p></div>
      </div>
      <div class="card"><h2>ドメイン別の内訳</h2>
        <div class="table-wrap"><table class="simple"><tr><th>ドメイン</th><th>配分</th><th>正解/回答</th><th>解いた問題</th></tr>${detail}</table></div></div>
      <div class="card"><h2>履歴(新しい順・最大30件)</h2>
        ${hist ? `<div class="table-wrap"><table class="simple"><tr><th>日時</th><th>内容</th><th>正解</th><th>正答率</th></tr>${hist}</table></div>` : '<div class="empty">まだ記録がありません。<a href="#/practice">演習を始める</a></div>'}</div>
      <div class="card"><h2>記録の書き出し・読み込み</h2>
        <p class="note">別のブラウザや端末に記録を移すときに使います(JSONファイル)。</p>
        <div class="btn-row">
          <button id="exp">書き出し</button>
          <label class="btn">読み込み<input type="file" id="imp" accept="application/json,.json" style="display:none"></label>
          <button class="danger" id="rst">記録をすべて消去</button>
        </div>
      </div>`;

    document.getElementById('exp').onclick = () => {
      const blob = new Blob([S.exportJson()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ccaof-history-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    document.getElementById('imp').onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          if (!confirm('現在の記録を、読み込んだファイルの内容で置き換えます。よろしいですか?')) return;
          S.importJson(r.result); alert('読み込みました。'); renderStats(app);
        } catch (err) { alert('読み込めませんでした: ' + err.message); }
      };
      r.readAsText(f);
    };
    document.getElementById('rst').onclick = () => {
      if (confirm('このブラウザの演習記録をすべて消去します。元に戻せません。よろしいですか?')) { S.reset(); renderStats(app); }
    };
  }

  /* ---------- ルーティング(app.js から呼ばれる) ---------- */
  function parseQuery(str) {
    const o = {};
    (str || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); o[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return o;
  }

  C.quiz = {
    ready: true,
    keepScroll: false,
    handles: top => ['practice', 'quiz', 'results', 'stats'].includes(top),
    render(top, rest, app) {
      if (top !== 'quiz') stopTimer();
      if (top === 'practice') {
        if (!rest.length) return renderMenu(app);
        const [kindRaw, param] = rest;
        const [kind, q1] = kindRaw.split('?');
        const [p, q2] = (param || '').split('?');
        return startFromRoute(kind, p || null, parseQuery(q1 || q2));
      }
      if (top === 'quiz') return renderQuiz(app);
      if (top === 'results') return renderResults(app, rest[0] ? decodeURIComponent(rest[0]) : null);
      if (top === 'stats') return renderStats(app);
    },
    // テスト・検証用
    _internal: { proportional, poolEnough, isCorrect }
  };
})();

</script>
<script>/* js/app.js */
/*
 * CCAO-F 学習トレーナー — 画面描画とルーティング
 * ビルド不要。index.html を直接開いても動くよう、ハッシュルーティング(#/...)を使う。
 */
(function () {
  const C = window.CCAOF;
  const app = document.getElementById('app');

  /* ---------- ユーティリティ ---------- */
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const domainById = id => C.exam.domains.find(d => d.id === id);
  const fmtDate = iso => {
    const [y, m, d] = String(iso).split('-');
    return `${y}年${Number(m)}月${Number(d)}日`;
  };

  function srcLinks(refs) {
    if (!refs || !refs.length) return '';
    const parts = refs.map(r => {
      const s = C.sources && C.sources[r];
      if (!s) return esc(r);
      return s.url
        ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
        : esc(s.label);
    });
    return `<span class="src">出典: ${parts.join(' / ')}</span>`;
  }

  function statusBadge(status) {
    return status === 'check'
      ? '<span class="badge check" title="公式情報で確認できなかった、または資料間で食い違いがある内容です">要確認</span>'
      : '';
  }

  function objTag(obj) {
    return obj ? `<span class="obj-tag" title="Exam Guide v1.0 の目標番号">${esc(obj)}</span>` : '';
  }

  function domainBars(rows) {
    return `<div class="domain-bars">${rows.map(r => `
      <div class="dbar">
        <div class="name" title="${esc(r.title || r.name)}">${esc(r.name)}</div>
        <div class="track"><div class="fill ${r.cls || ''}" style="width:${Math.max(0, Math.min(100, r.pct))}%"></div></div>
        <div class="pct">${esc(r.label)}</div>
      </div>`).join('')}</div>`;
  }

  function setActiveNav(route) {
    document.querySelectorAll('#nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.route === route);
    });
  }

  /* ---------- ホーム ---------- */
  function renderHome() {
    const e = C.exam;
    const qCount = C.questions.length;
    const st = C.store.load();
    const attempts = st.attempts.length;

    const sortedDomains = [...e.domains].sort((a, b) => b.weight - a.weight);
    const bars = domainBars(sortedDomains.map(d => ({
      name: `${d.no}. ${d.nameJa}`, title: d.nameEn, pct: d.weight / 21 * 100, label: d.weight + '%'
    })));

    const overview = `<div class="kv">${e.overview.map(o => `
      <div class="k">${esc(o.label)}</div>
      <div>${esc(o.value)} ${statusBadge(o.status)}<br>${srcLinks(o.refs)}</div>`).join('')}</div>`;

    const notices = e.notices.map(n => `<li><strong>${fmtDate(n.date)}</strong> — ${esc(n.text)}</li>`).join('');

    app.innerHTML = `
      <div class="page-head">
        <h1>CCAO-F 学習トレーナー</h1>
        <div class="sub">${esc(e.nameEn)}(${esc(e.code)})の非公式学習サイト。Exam Guide v${esc(e.guide.version)}(${esc(e.guide.effective)}版)を基準に、${fmtDate(e.contentAsOf)}時点の情報で作成しています。</div>
      </div>

      <div class="card accent">
        <div class="badge-row"><span class="pill">お知らせ</span></div>
        <ul style="margin-top:6px">${notices}</ul>
        <p class="note">12月7日以降に受験する場合は、11月17日公開予定の新しいExam Guideを必ず確認してください。本サイトも公開後に差分を更新する予定です。</p>
      </div>

      <div class="card">
        <h2>試験の概要</h2>
        <div class="badge-row">
          <span class="badge">${e.items}問</span><span class="badge">${e.minutes}分</span>
          <span class="badge">合格 ${e.passingScaled} / ${e.scale}</span><span class="badge">${esc(e.fee)}</span>
          <span class="badge">英語・日本語</span>
        </div>
        <h3>ドメイン配分(出題比率)</h3>
        ${bars}
        <p class="note">最も比率が高いのは「出力の評価と検証」(21%)。プロンプトの書き方よりも、出力を鵜呑みにせず検証・判断する力が重視されています。</p>
        <details class="fold"><summary>試験概要の詳細(対象者・登録・再受験など)</summary><div class="fold-body">${overview}</div></details>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>📘 読んで学ぶ</h2>
          <p>序章と7ドメイン(7章)の教科書です。各章に「要点・具体例・よくある誤り・確認ポイント」があります。</p>
          <div class="btn-row">
            <a class="btn primary" href="#/textbook">教科書を開く</a>
            <a class="btn" href="#/glossary">用語集</a>
            <a class="btn" href="#/quickref">クイックリファレンス</a>
          </div>
        </div>
        <div class="card">
          <h2>✍️ 解いて学ぶ</h2>
          <p>${qCount ? `オリジナル問題 ${qCount}問を収録。` : 'オリジナル問題(全90問)はフェーズ2で追加予定です。'}章別演習・ミニ模試・60問模試・苦手ドメイン演習・間違えた問題の復習ができます。</p>
          <div class="btn-row">
            <a class="btn ${qCount ? 'primary' : ''}" href="#/practice">演習メニュー</a>
            <a class="btn" href="#/stats">成績</a>
          </div>
          <p class="note">${attempts ? `これまでの演習・模試: ${attempts}回` : 'まだ演習の履歴はありません。'}</p>
        </div>
      </div>

      <div class="card">
        <h2>おすすめの進め方</h2>
        <ol>
          <li>序章で試験の全体像と「AIの4つの性質」「4D」の考え方をつかむ。</li>
          <li>配分の大きい第2章(出力の評価と検証)・第4章・第6章から重点的に読む。</li>
          <li>各章の「確認ポイント」で理解度を自己チェックし、章別演習で定着させる。</li>
          <li>30問ミニ模試 → 60問模試で時間配分(1問あたり平均2分)に慣れる。</li>
          <li>成績画面で苦手ドメインを確認し、教科書の該当章と苦手ドメイン演習を往復する。</li>
        </ol>
        <p class="note">公式の無料コース「Claude Certified Associate – Foundations Prep Course」(Anthropic Partner Academy)の受講と、実際にClaudeでProjectsを作って試す実践を併用してください。${srcLinks(['S3'])}</p>
      </div>
    `;
  }

  /* ---------- 教科書 ---------- */
  function chapterLabel(ch) {
    return ch.no === 0 ? '序章' : `第${ch.no}章`;
  }

  function renderTextbookToc() {
    const tb = C.textbook;
    const items = tb.chapters.map(ch => {
      const d = ch.domain ? domainById(ch.domain) : null;
      return `<a href="#/textbook/${ch.no}">
        <span class="no">${chapterLabel(ch)}</span>
        <span>${esc(ch.title)}</span>
        <span class="w">${d ? d.weight + '%' : ''}</span>
      </a>`;
    }).join('');
    app.innerHTML = `
      <div class="page-head">
        <h1>📘 教科書</h1>
        <div class="sub">Exam Guide v${esc(C.exam.guide.version)} の目標(例: <span class="obj-tag">2.3</span>)ごとに整理しています。記述時点: ${fmtDate(tb.asOf)}</div>
      </div>
      <div class="callout warn"><strong>注意</strong>Claudeの機能名・画面・仕様は頻繁に変わります。本書の記述は${fmtDate(tb.asOf)}時点のものです。公式情報で確認できなかった内容や資料間で食い違いがある内容には <span class="badge check">要確認</span> を付けています。</div>
      <div class="card"><div class="toc">${items}</div></div>
      <div class="card">
        <h2>各章の構成</h2>
        <ul>
          <li><strong>要点</strong> — 試験目標ごとに押さえるべき考え方</li>
          <li><strong>具体例</strong> — 業務シナリオでの使い方(良い例・悪い例)</li>
          <li><strong>よくある誤り</strong> — 選択肢に出やすい「もっともらしい誤り」</li>
          <li><strong>確認ポイント</strong> — 読み終えたら説明できるか自己チェック</li>
        </ul>
      </div>`;
  }

  function renderChapter(no) {
    const tb = C.textbook;
    const idx = tb.chapters.findIndex(c => c.no === no);
    if (idx < 0) { location.hash = '#/textbook'; return; }
    const ch = tb.chapters[idx];
    const d = ch.domain ? domainById(ch.domain) : null;
    const prev = tb.chapters[idx - 1];
    const next = tb.chapters[idx + 1];

    const tabs = tb.chapters.map(c =>
      `<a href="#/textbook/${c.no}" class="${c.no === no ? 'active' : ''}">${chapterLabel(c)}${c.domain ? ' ' + esc(domainById(c.domain).short) : ' はじめに'}</a>`
    ).join('');

    const objList = d ? `<details class="fold"><summary>この章の試験目標(Exam Guide v${esc(C.exam.guide.version)})</summary><div class="fold-body"><ul>${
      d.objectives.map(o => `<li>${objTag(o.id)}${esc(o.ja)}<br><span class="note">${esc(o.en)}</span></li>`).join('')
    }</ul>${srcLinks(['S1'])}</div></details>` : '';

    const points = (ch.points || []).map(p => `
      <div class="section">
        <h3>${objTag(p.obj)}${esc(p.h)} ${statusBadge(p.status)}</h3>
        <div>${p.body}</div>
        ${p.refs && p.refs.length ? `<div class="meta">${srcLinks(p.refs)}</div>` : ''}
      </div>`).join('');

    const examples = (ch.examples || []).map(x => `
      <div class="example">
        <div class="scene">${objTag(x.obj)}${esc(x.scene)}</div>
        ${x.body ? `<div>${x.body}</div>` : ''}
        ${x.ng || x.ok ? `<div class="compare">
          ${x.ng ? `<div class="ng"><span class="lbl">✗ よくない</span>${x.ng}</div>` : ''}
          ${x.ok ? `<div class="ok"><span class="lbl">○ よい</span>${x.ok}</div>` : ''}
        </div>` : ''}
        ${x.why ? `<div class="note">${x.why}</div>` : ''}
      </div>`).join('');

    const pitfalls = (ch.pitfalls || []).map(p => `
      <div class="pitfall">
        <div class="wrong">${objTag(p.obj)}${esc(p.wrong)}</div>
        <div class="right">${p.right}</div>
      </div>`).join('');

    const checks = (ch.checkpoints || []).map(c => `<li>${objTag(c.obj)}${c.text}</li>`).join('');

    const qInDomain = d ? C.questions.filter(q => q.domain === d.id).length : 0;

    app.innerHTML = `
      <div class="chapter-tabs" role="navigation" aria-label="章の切り替え">${tabs}</div>
      <div class="page-head" style="margin-top:12px">
        <div class="badge-row">
          ${d ? `<span class="badge domain">Domain ${d.no} · 配分 ${d.weight}%</span>` : '<span class="badge domain">序章</span>'}
          <span class="badge">記述時点 ${fmtDate(ch.asOf || tb.asOf)}</span>
        </div>
        <h1>${chapterLabel(ch)} ${esc(ch.title)}</h1>
        ${d ? `<div class="sub">${esc(d.nameEn)}</div>` : ''}
      </div>
      ${ch.lead ? `<div class="card"><p>${ch.lead}</p>${objList}</div>` : objList}

      ${points ? `<div class="card"><div class="block-title"><span class="icon">📌</span>要点</div>${points}</div>` : ''}
      ${examples ? `<div class="card"><div class="block-title"><span class="icon">💼</span>具体例</div>${examples}</div>` : ''}
      ${pitfalls ? `<div class="card"><div class="block-title"><span class="icon">⚠️</span>よくある誤り</div>${pitfalls}</div>` : ''}
      ${checks ? `<div class="card"><div class="block-title"><span class="icon">✅</span>確認ポイント</div><p class="note">次のことを自分の言葉で説明できれば、この章は合格ラインです。</p><ul class="checklist">${checks}</ul></div>` : ''}

      <div class="btn-row">
        ${prev ? `<a class="btn" href="#/textbook/${prev.no}">← ${chapterLabel(prev)}</a>` : ''}
        ${next ? `<a class="btn primary" href="#/textbook/${next.no}">${chapterLabel(next)} →</a>` : `<a class="btn primary" href="#/quickref">クイックリファレンスへ →</a>`}
        ${d ? (qInDomain
          ? `<a class="btn" href="#/practice/domain/${d.id}">この章の問題を解く(${qInDomain}問)</a>`
          : `<button class="btn" disabled title="問題はフェーズ2で追加予定">この章の問題を解く(準備中)</button>`) : ''}
        <a class="btn ghost" href="#/textbook">目次</a>
      </div>`;
  }

  /* ---------- 用語集 ---------- */
  let glossaryState = { q: '', domain: '' };
  function renderGlossary() {
    const opts = ['<option value="">すべてのドメイン</option>']
      .concat(C.exam.domains.map(d => `<option value="${d.id}">${d.no}. ${esc(d.nameJa)}</option>`))
      .concat('<option value="general">共通・試験全般</option>').join('');
    app.innerHTML = `
      <div class="page-head">
        <h1>📚 用語集</h1>
        <div class="sub">${C.glossary.terms.length}語。英語の機能名と日本語の説明を併記しています。記述時点: ${fmtDate(C.glossary.asOf)}</div>
      </div>
      <div class="card">
        <div class="filter-row">
          <label><span class="sr-only">用語を検索</span><input type="search" id="g-q" placeholder="用語・説明を検索(例: ハルシネーション、Projects)" value="${esc(glossaryState.q)}"></label>
          <label><span class="sr-only">ドメインで絞り込み</span><select id="g-d">${opts}</select></label>
        </div>
      </div>
      <div class="card" id="g-list"></div>`;
    const qEl = document.getElementById('g-q');
    const dEl = document.getElementById('g-d');
    dEl.value = glossaryState.domain;
    const update = () => {
      glossaryState = { q: qEl.value, domain: dEl.value };
      drawGlossaryList();
    };
    qEl.addEventListener('input', update);
    dEl.addEventListener('change', update);
    drawGlossaryList();
  }

  function drawGlossaryList() {
    const q = glossaryState.q.trim().toLowerCase();
    const dom = glossaryState.domain;
    const list = C.glossary.terms.filter(t => {
      if (dom && !(t.domains || []).includes(dom)) return false;
      if (!q) return true;
      return [t.term, t.en, t.reading, t.def].join(' ').toLowerCase().includes(q);
    });
    const el = document.getElementById('g-list');
    if (!list.length) { el.innerHTML = '<div class="empty">該当する用語がありません。</div>'; return; }
    el.innerHTML = list.map(t => `
      <div class="term">
        <div class="t">${esc(t.term)}${t.en ? `<span class="en">${esc(t.en)}</span>` : ''} ${statusBadge(t.status)}</div>
        <div class="d">${t.def}</div>
        <div class="rel">${(t.domains || []).map(id => id === 'general' ? '共通' : `D${domainById(id).no} ${esc(domainById(id).short)}`).join(' / ')}${t.refs && t.refs.length ? ' · ' + srcLinks(t.refs) : ''}</div>
      </div>`).join('');
  }

  /* ---------- クイックリファレンス ---------- */
  function renderQuickref() {
    const qr = C.quickref;
    const groups = C.exam.domains.map(d => {
      const items = qr.items.filter(i => i.domain === d.id);
      if (!items.length) return '';
      return `<div class="card">
        <div class="badge-row"><span class="badge domain">Domain ${d.no} · ${d.weight}%</span></div>
        <h2>${esc(d.nameJa)}</h2>
        ${items.map(i => `<div class="qr">
          <div class="q">${esc(i.trigger)}</div>
          <div class="pick">${i.pick}</div>
          ${i.avoid ? `<div class="avoid">${i.avoid}</div>` : ''}
        </div>`).join('')}
        <div class="btn-row"><a class="btn small ghost" href="#/textbook/${d.no}">第${d.no}章を読む</a></div>
      </div>`;
    }).join('');

    const principles = qr.principles.map(p => `<li>${p}</li>`).join('');

    app.innerHTML = `
      <div class="page-head">
        <h1>🗂 クイックリファレンス</h1>
        <div class="sub">「こう問われたら、これを選ぶ」の早見表。試験直前の見直し用です。記述時点: ${fmtDate(qr.asOf)}</div>
      </div>
      <div class="card accent">
        <h2>迷ったときの判断原則</h2>
        <ul>${principles}</ul>
        <p class="note">公式Exam Guideのサンプル問題3問(第8節)の解説から読み取れる考え方を、本サイトの言葉でまとめたものです。サンプル問題そのものは公式ガイドで確認してください。${srcLinks(['S1'])}</p>
      </div>
      ${groups}`;
  }

  /* ---------- 演習・成績(フェーズ2で実装) ---------- */
  function renderComingSoon(title, body) {
    app.innerHTML = `
      <div class="page-head"><h1>${esc(title)}</h1></div>
      <div class="card">
        <p>${body}</p>
        <div class="btn-row"><a class="btn primary" href="#/textbook">教科書を読む</a><a class="btn" href="#/">ホーム</a></div>
      </div>`;
  }

  /* ---------- ルーター ---------- */
  function route() {
    const hash = location.hash.replace(/^#\/?/, '');
    const parts = hash.split('/').filter(Boolean);
    const top = parts[0] || 'home';
    setActiveNav(top);

    // フェーズ2の画面は quiz.js が提供する
    if (C.quiz && C.quiz.ready && C.quiz.handles(top)) {
      C.quiz.render(top, parts.slice(1), app);
    } else if (top === 'home') renderHome();
    else if (top === 'textbook') parts[1] !== undefined ? renderChapter(Number(parts[1])) : renderTextbookToc();
    else if (top === 'glossary') renderGlossary();
    else if (top === 'quickref') renderQuickref();
    else if (top === 'practice') renderComingSoon('✍️ 演習', '演習機能(章別・自由演習・30問ミニ模試・苦手ドメイン・間違えた問題の復習)はフェーズ2-Aで、60問模試はフェーズ2-Bで追加予定です。');
    else if (top === 'stats') renderComingSoon('📊 成績', 'ドメイン別成績・受験履歴はフェーズ2-Aで追加予定です。');
    else renderHome();

    // 模試中以外は先頭へスクロール
    if (!(C.quiz && C.quiz.keepScroll)) window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }

  // 公開ユーティリティ(quiz.js から利用)
  C.ui = { esc, domainById, fmtDate, srcLinks, statusBadge, objTag, domainBars, route };

  document.getElementById('footer-asof').textContent =
    `記述時点: ${fmtDate(C.exam.contentAsOf)} / 基準: Exam Guide v${C.exam.guide.version}(${C.exam.guide.effective}版)`;

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
