<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Claude認定資格 CCAO-F(Claude Certified Associate – Foundations)の非公式学習サイト。教科書・用語集・クイックリファレンス・オリジナル練習問題。">
<meta name="theme-color" content="#b5532c">
<title>CCAO-F 学習トレーナー(非公式)</title>
<style>
/* CCAO-F 学習トレーナー — スタイル(外部フォント・CDNなし) */
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #f1eee7;
  --text: #22201c;
  --muted: #6b665d;
  --border: #e2ddd2;
  --accent: #b5532c;
  --accent-weak: #f6e6dd;
  --accent-text: #ffffff;
  --good: #2f7d4f;
  --good-weak: #e3f2e8;
  --bad: #b33a3a;
  --bad-weak: #f8e4e4;
  --warn: #8a6100;
  --warn-weak: #fbf0d4;
  --info: #2c5d8a;
  --info-weak: #e3edf7;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18;
    --surface: #252320;
    --surface-2: #2e2b27;
    --text: #ece8e1;
    --muted: #a8a196;
    --border: #3a3631;
    --accent: #e07a4f;
    --accent-weak: #3b2a22;
    --accent-text: #1b1a18;
    --good: #6cc391;
    --good-weak: #1f3327;
    --bad: #ec8080;
    --bad-weak: #3a2222;
    --warn: #e6c062;
    --warn-weak: #3a3220;
    --info: #8dbbe6;
    --info-weak: #1f2c3a;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.75;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .choice:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- レイアウト ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
}
.brand {
  font-weight: 700; color: var(--text); text-decoration: none;
  white-space: nowrap; font-size: .95rem;
}
.brand .pill { margin-right: 6px; }
.nav {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  margin-left: auto;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  white-space: nowrap; text-decoration: none; color: var(--muted);
  padding: 6px 10px; border-radius: 8px; font-size: .88rem;
}
.nav a.active, .nav a:hover { background: var(--surface-2); color: var(--text); }

main { max-width: 900px; margin: 0 auto; padding: 16px 16px 40px; }
main:focus { outline: none; }
@media (max-width: 640px) {
  .topbar-inner { flex-wrap: wrap; gap: 4px 12px; padding: 6px 12px; }
  .nav { margin-left: 0; width: 100%; flex-wrap: wrap; overflow: visible; }
  .nav a { padding: 4px 8px; }
}

.page-head { margin: 8px 0 16px; }
.page-head h1 { font-size: 1.45rem; margin: 0 0 4px; line-height: 1.4; }
.page-head .sub { color: var(--muted); font-size: .9rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card.accent { border-color: var(--accent); }
.card h2 { font-size: 1.15rem; margin: 0 0 10px; line-height: 1.45; }
.card h3 { font-size: 1.02rem; margin: 18px 0 6px; line-height: 1.5; }
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }
.card ul, .card ol { margin: 4px 0 10px; padding-left: 1.4em; }
.card li { margin-bottom: 4px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

/* ---------- 部品 ---------- */
.pill {
  display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 999px;
  background: var(--accent); color: var(--accent-text);
  vertical-align: middle;
}
.badge {
  display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  vertical-align: middle; line-height: 1.6;
}
.badge.check { background: var(--warn-weak); color: var(--warn); border-color: transparent; font-weight: 700; }
.badge.ok { background: var(--good-weak); color: var(--good); border-color: transparent; }
.badge.domain { background: var(--accent-weak); color: var(--accent); border-color: transparent; font-weight: 700; }
.badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button, .btn {
  font: inherit; font-size: .92rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 8px 14px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  cursor: pointer; text-decoration: none; line-height: 1.4;
}
button:hover, .btn:hover { background: var(--surface-2); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
button.primary:hover, .btn.primary:hover { filter: brightness(1.05); }
button.ghost, .btn.ghost { background: transparent; }
button.small, .btn.small { min-height: 34px; padding: 4px 10px; font-size: .84rem; }
button:disabled, .btn.disabled { opacity: .45; cursor: not-allowed; }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }

input[type="search"], input[type="text"], select {
  font: inherit; font-size: 1rem;
  min-height: 42px; padding: 6px 10px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  width: 100%;
}
.filter-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
@media (max-width: 560px) { .filter-row { grid-template-columns: 1fr; } }

.note { font-size: .85rem; color: var(--muted); }
.callout {
  border-radius: 10px; padding: 10px 12px; margin: 10px 0;
  background: var(--info-weak); color: var(--text); font-size: .92rem;
}
.callout.warn { background: var(--warn-weak); }
.callout.good { background: var(--good-weak); }
.callout.bad { background: var(--bad-weak); }
.callout strong:first-child { margin-right: 4px; }

/* ドメインバー */
.domain-bars { display: grid; gap: 6px; margin: 8px 0; }
.dbar { display: grid; grid-template-columns: minmax(0, 13em) 1fr 3.4em; align-items: center; gap: 8px; font-size: .86rem; }
.dbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbar .track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.dbar .fill { height: 100%; background: var(--accent); border-radius: 999px; }
.dbar .fill.good { background: var(--good); }
.dbar .fill.bad { background: var(--bad); }
.dbar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
@media (max-width: 560px) {
  .dbar { grid-template-columns: 1fr 3.4em; row-gap: 2px; }
  .dbar .name { grid-column: 1 / -1; white-space: normal; }
}

/* 概要表 */
.kv { display: grid; grid-template-columns: 8.5em 1fr; gap: 0; border-top: 1px solid var(--border); }
.kv > div { padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: .9rem; }
.kv .k { color: var(--muted); font-weight: 700; }
@media (max-width: 560px) {
  .kv { grid-template-columns: 1fr; }
  .kv .k { border-bottom: none; padding-bottom: 0; }
}

details.fold { border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; margin: 10px 0; background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 10px 0; font-weight: 700; font-size: .92rem; list-style-position: inside; }
details.fold[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 8px; }
details.fold > .fold-body { padding-bottom: 10px; }

/* ---------- 教科書 ---------- */
.toc { display: grid; gap: 8px; }
.toc a {
  display: grid; grid-template-columns: 4.2em 1fr auto; gap: 8px; align-items: center;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  text-decoration: none; color: var(--text); background: var(--surface);
}
.toc a:hover { background: var(--surface-2); }
.toc .no { color: var(--accent); font-weight: 700; font-size: .9rem; }
.toc .w { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.chapter-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chapter-tabs a {
  white-space: nowrap; text-decoration: none; font-size: .82rem;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--surface);
}
.chapter-tabs a.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }

.block-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 1.08rem; font-weight: 700; margin: 0 0 10px;
}
.block-title .icon { font-size: 1.1rem; }
.section { padding: 12px 0; border-top: 1px dashed var(--border); }
.section:first-of-type { border-top: none; padding-top: 4px; }
.section h3 { margin: 0 0 6px; font-size: 1rem; }
.section .meta { margin-top: 6px; }
.obj-tag { font-size: .72rem; font-weight: 700; color: var(--accent); background: var(--accent-weak); padding: 1px 6px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }
.src { font-size: .78rem; color: var(--muted); }
.src a { color: var(--muted); }
.example {
  border-left: 4px solid var(--info); background: var(--info-weak);
  border-radius: 0 10px 10px 0; padding: 10px 12px; margin: 10px 0;
}
.example .scene { font-weight: 700; font-size: .9rem; margin-bottom: 4px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.compare > div { border-radius: 8px; padding: 8px 10px; font-size: .9rem; }
.compare .ng { background: var(--bad-weak); }
.compare .ok { background: var(--good-weak); }
.compare .lbl { font-weight: 700; font-size: .78rem; display: block; margin-bottom: 2px; }
@media (max-width: 560px) { .compare { grid-template-columns: 1fr; } }
.pitfall { padding: 10px 0; border-top: 1px dashed var(--border); }
.pitfall:first-of-type { border-top: none; }
.pitfall .wrong { font-weight: 700; color: var(--bad); }
.pitfall .wrong::before { content: "✗ "; }
.pitfall .right { margin-top: 4px; }
.pitfall .right::before { content: "→ "; color: var(--good); font-weight: 700; }
.checklist { list-style: none; padding-left: 0 !important; }
.checklist li { padding: 6px 0 6px 30px; position: relative; border-bottom: 1px dashed var(--border); }
.checklist li:last-child { border-bottom: none; }
.checklist li::before { content: "☐"; position: absolute; left: 4px; top: 5px; color: var(--accent); font-size: 1.05rem; }
table.simple { width: 100%; border-collapse: collapse; font-size: .88rem; margin: 8px 0; }
table.simple th, table.simple td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
table.simple th { background: var(--surface-2); }
.table-wrap { overflow-x: auto; }

/* ---------- 用語集 ---------- */
.term { padding: 10px 0; border-top: 1px dashed var(--border); }
.term:first-child { border-top: none; }
.term .t { font-weight: 700; }
.term .t .en { font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: 6px; }
.term .d { font-size: .93rem; margin-top: 2px; }
.term .rel { font-size: .8rem; color: var(--muted); margin-top: 4px; }

/* ---------- クイックリファレンス ---------- */
.qr { padding: 10px 0; border-top: 1px dashed var(--border); }
.qr:first-of-type { border-top: none; }
.qr .q { font-weight: 700; font-size: .95rem; }
.qr .q::before { content: "こう問われたら → "; color: var(--muted); font-weight: 400; font-size: .82rem; }
.qr .pick { margin-top: 4px; }
.qr .pick::before { content: "✅ 選ぶ: "; font-weight: 700; color: var(--good); }
.qr .avoid { margin-top: 2px; color: var(--muted); font-size: .9rem; }
.qr .avoid::before { content: "⛔ 避ける: "; font-weight: 700; color: var(--bad); }

/* ---------- フッター ---------- */
footer.site-footer {
  max-width: 900px; margin: 0 auto; padding: 18px 16px 32px;
  font-size: .8rem; color: var(--muted); border-top: 1px solid var(--border);
}
footer.site-footer p { margin: 0 0 6px; }

.empty { text-align: center; color: var(--muted); padding: 24px 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media print {
  .topbar, .btn-row, .chapter-tabs { display: none; }
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
}

</style>
</head>

<script>/* data/exam.js */
/*
 * CCAO-F 試験メタデータ
 * 根拠: Claude Certified Associate – Foundations Exam Guide v1.0 (Effective July 2026) [S1]

 * tools/validate.js で洗い出せる。
 */
window.CCAOF = window.CCAOF || {};

CCAOF.exam = {
  code: 'CCAO-F',
  nameEn: 'Claude Certified Associate – Foundations',
  nameJa: 'Claude認定アソシエイト – ファウンデーション',
  guide: { version: '1.0', effective: '2026年7月', sourceRef: 'S1' },
  contentAsOf: '2026-11-09',          // 本サイトの記述時点
  items: 60,
  minutes: 120,
  passingScaled: 720,
  scale: '100〜1,000',
  passLinePct: 72,                    // 本サイト独自の目安(公式換算ではない)
  fee: '$99 USD',

  // 試験概要(ホーム画面の表示用)。status: 'confirmed' | 'check'(要確認)
  overview: [
    { label: '対象者', value: '業務でClaudeを生産性ツールとして使い、Projectsを構築する専門職(オペレーション、マーケティング、PM、教育、広報、一般の知識労働者など)。APIで開発するソフトウェア開発者や、エージェント型システムの設計者は対象外。', status: 'confirmed', refs: ['S1'] },
    { label: '推奨経験', value: '業務でClaudeを日常的に使った経験、構造化された問題解決・ワークフロー設計の基礎理解、ハルシネーション・コンテキスト制約・データ機密性などAIの限界の実践的理解。必須ではない。', status: 'confirmed', refs: ['S1'] },
    { label: '前提条件', value: '必須の前提条件・受講必須コースなし。ソフトウェア開発・APIの経験も不要。合否は試験結果のみで判定。', status: 'confirmed', refs: ['S1'] },
    { label: '出題形式', value: '60問。単一選択(multiple-choice)と複数選択(multiple-response)。各問で選ぶ数が明示される。', status: 'confirmed', refs: ['S1'] },
    { label: '試験時間', value: '120分', status: 'confirmed', refs: ['S1'] },
    { label: '合格基準', value: 'スケールスコア720(100〜1,000)。他の受験者との相対評価ではなく、固定基準に対する絶対評価。', status: 'confirmed', refs: ['S1'] },
    { label: '結果の通知', value: '合否とスケールスコア、ドメイン別の正答率。ドメイン別正答率は参考情報で、合否はトータルのスケールスコアで決まる。', status: 'confirmed', refs: ['S1'] },
    { label: '受験料', value: '$99 USD(パートナー階層による割引がある場合はチェックアウト時に反映)。', status: 'confirmed', refs: ['S1'] },
    { label: '言語', value: '英語・日本語。1回の登録で両方に対応し、日程予約時に言語を選ぶ。', status: 'confirmed', refs: ['S2'] },
    { label: '受験方法', value: 'Pearson VUEのオンライン監督(OnVUE)またはテストセンター。', status: 'confirmed', refs: ['S1', 'S2'] },
    { label: '登録の流れ', value: 'Anthropic Partner Academyで登録・支払い → 初めてのPearson受験ならPearsonのユーザー名とパスワードがメールで届く → Pearson VUEのAnthropic専用ログインで日程予約。', status: 'confirmed', refs: ['S1', 'S4'] },
    { label: '受験資格', value: 'Pearson VUEのページでは「Claude Partner Networkの組織に開放」とされている。パートナー企業以外の受験可否は公式FAQで要確認。', status: 'check', refs: ['S4', 'S2'] },
    { label: 'キャンセル・変更', value: 'Exam Guide v1.0では「予約の24時間前まで」、Pearson VUEのAnthropicページでは「48時間前まで」と記載が異なる。安全側の48時間前を目安に。', status: 'check', refs: ['S1', 'S4'] },
    { label: '再受験', value: '不合格後の待機期間は1回目14日・2回目30日・3回目90日。12か月のローリング期間で同一試験は最大4回。受験ごとに受験料が必要。', status: 'confirmed', refs: ['S1', 'S4'] },
    { label: '有効期間・更新', value: '認定から12か月。期限内なら変更点を確認し、Partner Academyの無料・監督なしの更新評価で更新できる。失効後は正規料金で再受験。内容が大きく変わった場合は再受験を求められることがある。', status: 'confirmed', refs: ['S1'] },
    { label: '当日のルール', value: '政府発行の有効な写真付きID(登録名と完全一致)が必要。メモ・書籍・スマホ・第2モニター等は不可。試験内容の撮影・複製・開示は禁止(NDAへの同意が必要)。', status: 'confirmed', refs: ['S1'] },
    { label: 'パートナー階層', value: 'この資格はClaude Partner Networkの階層要件にはカウントされない。', status: 'confirmed', refs: ['S2'] }
  ],

  // 更新予告
  notices: [

<script>/* js/storage.js */
/*
 * 学習履歴の保存(localStorage)
 * 問題は固定ID(例 "D2-001")で記録するため、データを差し替えても履歴はずれない。
 * 保存形式:
 *   { version:1,
 *     attempts:[{ id, mode, label, startedAt, finishedAt, durationSec, total, correct,
 *                 byDomain:{D1:{correct,total}}, items:[{qid, domain, correct}] }],
 *     qstats:{ "D2-001": { seen, correct, lastCorrect, lastAt } },
 *     inProgress: null | { ...模試の途中状態 } }
 */
(function () {
  const KEY = 'ccaof.v1';
  const empty = () => ({ version: 1, attempts: [], qstats: {}, inProgress: null });

  let memoryFallback = null; // localStorageが使えない環境(一部ブラウザのfile://等)用

  function available() {
    try {
      const t = '__ccaof_test__';
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      return true;
    } catch (e) {
      return false;
    }
  }
  const canPersist = available();

  function load() {
    if (!canPersist) return memoryFallback || (memoryFallback = empty());
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return empty();
      const data = JSON.parse(raw);
      return Object.assign(empty(), data);
    } catch (e) {
      return empty();
    }
  }

  function save(data) {
    if (!canPersist) { memoryFallback = data; return; }
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      alert('履歴を保存できませんでした(ブラウザの保存領域が不足している可能性があります)。');
    }
  }

  /** 1回分の演習・模試の結果を記録する */
  function recordAttempt(attempt) {
    const data = load();
    data.attempts.push(attempt);
    attempt.items.forEach(it => {
      const s = data.qstats[it.qid] || { seen: 0, correct: 0, lastCorrect: null, lastAt: null };
      s.seen += 1;
      if (it.correct) s.correct += 1;
      s.lastCorrect = !!it.correct;
      s.lastAt = attempt.finishedAt;
      data.qstats[it.qid] = s;
    });
    save(data);
  }

  /** 直近の回答が不正解の問題ID(=復習対象) */
  function wrongIds() {
    const q = load().qstats;
    return Object.keys(q).filter(id => q[id].lastCorrect === false);
  }

  /** ドメイン別の累積正答数(qstatsベースではなく全回答ベース) */
  function domainStats() {
    const out = {};
    load().attempts.forEach(a => {
      a.items.forEach(it => {
        const d = out[it.domain] || (out[it.domain] = { correct: 0, total: 0 });
        d.total += 1;
        if (it.correct) d.correct += 1;
      });
    });
    return out;
  }

  /** 苦手ドメイン: 回答数 minSamples 以上で正答率が threshold 未満。弱い順。 */
  function weakDomains(minSamples, threshold) {
    const st = domainStats();
    return Object.keys(st)
      .map(id => ({ id, correct: st[id].correct, total: st[id].total, acc: st[id].correct / st[id].total }))
      .filter(d => d.total >= minSamples && d.acc < threshold)
      .sort((a, b) => a.acc - b.acc);
  }

  function saveInProgress(obj) { const d = load(); d.inProgress = obj; save(d); }
  function loadInProgress() { return load().inProgress; }
  function clearInProgress() { const d = load(); d.inProgress = null; save(d); }

  function exportJson() {
    return JSON.stringify(Object.assign({ exportedAt: new Date().toISOString(), app: 'ccaof-trainer' }, load()), null, 2);
  }

  function importJson(text) {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.attempts) || typeof data.qstats !== 'object') {
      throw new Error('形式が正しくありません');
    }
    save({ version: 1, attempts: data.attempts, qstats: data.qstats, inProgress: null });
  }

  function reset() { save(empty()); }

  window.CCAOF = window.CCAOF || {};
  CCAOF.store = {
    canPersist, load, save, recordAttempt, wrongIds, domainStats, weakDomains,
    saveInProgress, loadInProgress, clearInProgress, exportJson, importJson, reset
  };
})();

</script>

<script>/* js/app.js */
/*
 * CCAO-F 学習トレーナー — 画面描画とルーティング
 * ビルド不要。index.html を直接開いても動くよう、ハッシュルーティング(#/...)を使う。
 */
(function () {
  const C = window.CCAOF;
  const app = document.getElementById('app');

  /* ---------- ユーティリティ ---------- */
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const domainById = id => C.exam.domains.find(d => d.id === id);
  const fmtDate = iso => {
    const [y, m, d] = String(iso).split('-');
    return `${y}年${Number(m)}月${Number(d)}日`;
  };

  function srcLinks(refs) {
    if (!refs || !refs.length) return '';
    const parts = refs.map(r => {
      const s = C.sources && C.sources[r];
      if (!s) return esc(r);
      return s.url
        ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
        : esc(s.label);
    });
    return `<span class="src">出典: ${parts.join(' / ')}</span>`;
  }

  function statusBadge(status) {
    return status === 'check'
      ? '<span class="badge check" title="公式情報で確認できなかった、または資料間で食い違いがある内容です">要確認</span>'
      : '';
  }

  function objTag(obj) {
    return obj ? `<span class="obj-tag" title="Exam Guide v1.0 の目標番号">${esc(obj)}</span>` : '';
  }

  function domainBars(rows) {
    return `<div class="domain-bars">${rows.map(r => `
      <div class="dbar">
        <div class="name" title="${esc(r.title || r.name)}">${esc(r.name)}</div>
        <div class="track"><div class="fill ${r.cls || ''}" style="width:${Math.max(0, Math.min(100, r.pct))}%"></div></div>
        <div class="pct">${esc(r.label)}</div>
      </div>`).join('')}</div>`;
  }

  function setActiveNav(route) {
    document.querySelectorAll('#nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.route === route);
    });
  }

  /* ---------- ホーム ---------- */
  function renderHome() {
    const e = C.exam;
    const qCount = C.questions.length;
    const st = C.store.load();
    const attempts = st.attempts.length;

    const sortedDomains = [...e.domains].sort((a, b) => b.weight - a.weight);
    const bars = domainBars(sortedDomains.map(d => ({
      name: `${d.no}. ${d.nameJa}`, title: d.nameEn, pct: d.weight / 21 * 100, label: d.weight + '%'
    })));

    const overview = `<div class="kv">${e.overview.map(o => `
      <div class="k">${esc(o.label)}</div>
      <div>${esc(o.value)} ${statusBadge(o.status)}<br>${srcLinks(o.refs)}</div>`).join('')}</div>`;

    const notices = e.notices.map(n => `<li><strong>${fmtDate(n.date)}</strong> — ${esc(n.text)}</li>`).join('');

    app.innerHTML = `
      <div class="page-head">
        <h1>CCAO-F 学習トレーナー</h1>
        <div class="sub">${esc(e.nameEn)}(${esc(e.code)})の非公式学習サイト。Exam Guide v${esc(e.guide.version)}(${esc(e.guide.effective)}版)を基準に、${fmtDate(e.contentAsOf)}時点の情報で作成しています。</div>
      </div>

      <div class="card accent">
        <div class="badge-row"><span class="pill">お知らせ</span></div>
        <ul style="margin-top:6px">${notices}</ul>
        <p class="note">12月7日以降に受験する場合は、11月17日公開予定の新しいExam Guideを必ず確認してください。本サイトも公開後に差分を更新する予定です。</p>
      </div>

      <div class="card">
        <h2>試験の概要</h2>
        <div class="badge-row">
          <span class="badge">${e.items}問</span><span class="badge">${e.minutes}分</span>
          <span class="badge">合格 ${e.passingScaled} / ${e.scale}</span><span class="badge">${esc(e.fee)}</span>
          <span class="badge">英語・日本語</span>
        </div>
        <h3>ドメイン配分(出題比率)</h3>
        ${bars}
        <p class="note">最も比率が高いのは「出力の評価と検証」(21%)。プロンプトの書き方よりも、出力を鵜呑みにせず検証・判断する力が重視されています。</p>
        <details class="fold"><summary>試験概要の詳細(対象者・登録・再受験など)</summary><div class="fold-body">${overview}</div></details>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>📘 読んで学ぶ</h2>

            <a class="btn" href="#/glossary">用語集</a>
            <a class="btn" href="#/quickref">クイックリファレンス</a>

          <h2>✍️ 解いて学ぶ</h2>

      <div class="card">

  /* ---------- 教科書 ---------- */
  function chapterLabel(ch) {

  }

  function renderTextbookToc() {
    const tb = C.textbook;
    const items = tb.chapters.map(ch => {
      const d = ch.domain ? domainById(ch.domain) : null;

      <div class="callout warn"><strong>注意</strong>Claudeの機能名・画面・仕様は頻繁に変わります。本書の記述は${fmtDate(tb.asOf)}時点のものです。公式情報で確認できなかった内容や資料間で食い違いがある内容には <span class="badge check">要確認</span> を付けています。</div>
      <div class="card"><div class="toc">${items}</div></div>
      <div class="card">
        <h2>各章の構成</h2>
        <ul>
          <li><strong>要点</strong> — 試験目標ごとに押さえるべき考え方</li>
          <li><strong>具体例</strong> — 業務シナリオでの使い方(良い例・悪い例)</li>
          <li><strong>よくある誤り</strong> — 選択肢に出やすい「もっともらしい誤り」</li>
          <li><strong>確認ポイント</strong> — 読み終えたら説明できるか自己チェック</li>
        </ul>
      </div>`;
  }

  function renderChapter(no) {
    const tb = C.textbook;
    const idx = tb.chapters.findIndex(c => c.no === no);
    if (idx < 0) { location.hash = '#/textbook'; return; }
    const ch = tb.chapters[idx];
    const d = ch.domain ? domainById(ch.domain) : null;
    const prev = tb.chapters[idx - 1];
    const next = tb.chapters[idx + 1];

    const tabs = tb.chapters.map(c =>
      `<a href="#/textbook/${c.no}" class="${c.no === no ? 'active' : ''}">${chapterLabel(c)}${c.domain ? ' ' + esc(domainById(c.domain).short) : ' はじめに'}</a>`
    ).join('');

    const objList = d ? `<details class="fold"><summary>この章の試験目標(Exam Guide v${esc(C.exam.guide.version)})</summary><div class="fold-body"><ul>${
      d.objectives.map(o => `<li>${objTag(o.id)}${esc(o.ja)}<br><span class="note">${esc(o.en)}</span></li>`).join('')
    }</ul>${srcLinks(['S1'])}</div></details>` : '';

    const points = (ch.points || []).map(p => `
      <div class="section">
        <h3>${objTag(p.obj)}${esc(p.h)} ${statusBadge(p.status)}</h3>
        <div>${p.body}</div>
        ${p.refs && p.refs.length ? `<div class="meta">${srcLinks(p.refs)}</div>` : ''}
      </div>`).join('');

    const examples = (ch.examples || []).map(x => `
      <div class="example">
        <div class="scene">${objTag(x.obj)}${esc(x.scene)}</div>
        ${x.body ? `<div>${x.body}</div>` : ''}
        ${x.ng || x.ok ? `<div class="compare">
          ${x.ng ? `<div class="ng"><span class="lbl">✗ よくない</span>${x.ng}</div>` : ''}
          ${x.ok ? `<div class="ok"><span class="lbl">○ よい</span>${x.ok}</div>` : ''}
        </div>` : ''}
        ${x.why ? `<div class="note">${x.why}</div>` : ''}
      </div>`).join('');

    const pitfalls = (ch.pitfalls || []).map(p => `
      <div class="pitfall">
        <div class="wrong">${objTag(p.obj)}${esc(p.wrong)}</div>
        <div class="right">${p.right}</div>
      </div>`).join('');

    const checks = (ch.checkpoints || []).map(c => `<li>${objTag(c.obj)}${c.text}</li>`).join('');

    const qInDomain = d ? C.questions.filter(q => q.domain === d.id).length : 0;

    app.innerHTML = `
      <div class="chapter-tabs" role="navigation" aria-label="章の切り替え">${tabs}</div>
      <div class="page-head" style="margin-top:12px">
        <div class="badge-row">
          ${d ? `<span class="badge domain">Domain ${d.no} · 配分 ${d.weight}%</span>` : '<span class="badge domain">序章</span>'}
          <span class="badge">記述時点 ${fmtDate(ch.asOf || tb.asOf)}</span>
        </div>
        <h1>${chapterLabel(ch)} ${esc(ch.title)}</h1>
        ${d ? `<div class="sub">${esc(d.nameEn)}</div>` : ''}
      </div>
      ${ch.lead ? `<div class="card"><p>${ch.lead}</p>${objList}</div>` : objList}

      ${points ? `<div class="card"><div class="block-title"><span class="icon">📌</span>要点</div>${points}</div>` : ''}
      ${examples ? `<div class="card"><div class="block-title"><span class="icon">💼</span>具体例</div>${examples}</div>` : ''}
      ${pitfalls ? `<div class="card"><div class="block-title"><span class="icon">⚠️</span>よくある誤り</div>${pitfalls}</div>` : ''}
      ${checks ? `<div class="card"><div class="block-title"><span class="icon">✅</span>確認ポイント</div><p class="note">次のことを自分の言葉で説明できれば、この章は合格ラインです。</p><ul class="checklist">${checks}</ul></div>` : ''}

      <div class="btn-row">
        ${prev ? `<a class="btn" href="#/textbook/${prev.no}">← ${chapterLabel(prev)}</a>` : ''}
        ${next ? `<a class="btn primary" href="#/textbook/${next.no}">${chapterLabel(next)} →</a>` : `<a class="btn primary" href="#/quickref">クイックリファレンスへ →</a>`}
        ${d ? (qInDomain
          ? `<a class="btn" href="#/practice/domain/${d.id}">この章の問題を解く(${qInDomain}問)</a>`
          : `<button class="btn" disabled title="問題はフェーズ2で追加予定">この章の問題を解く(準備中)</button>`) : ''}
        <a class="btn ghost" href="#/textbook">目次</a>
      </div>`;
  }

  /* ---------- 用語集 ---------- */
  let glossaryState = { q: '', domain: '' };
  function renderGlossary() {
    const opts = ['<option value="">すべてのドメイン</option>']
      .concat(C.exam.domains.map(d => `<option value="${d.id}">${d.no}. ${esc(d.nameJa)}</option>`))
      .concat('<option value="general">共通・試験全般</option>').join('');
    app.innerHTML = `
      <div class="page-head">
        <h1>📚 用語集</h1>
        <div class="sub">${C.glossary.terms.length}語。英語の機能名と日本語の説明を併記しています。記述時点: ${fmtDate(C.glossary.asOf)}</div>
      </div>
      <div class="card">
        <div class="filter-row">
          <label><span class="sr-only">用語を検索</span><input type="search" id="g-q" placeholder="用語・説明を検索(例: ハルシネーション、Projects)" value="${esc(glossaryState.q)}"></label>
          <label><span class="sr-only">ドメインで絞り込み</span><select id="g-d">${opts}</select></label>
        </div>
      </div>
      <div class="card" id="g-list"></div>`;
    const qEl = document.getElementById('g-q');
    const dEl = document.getElementById('g-d');
    dEl.value = glossaryState.domain;
    const update = () => {
      glossaryState = { q: qEl.value, domain: dEl.value };
      drawGlossaryList();
    };
    qEl.addEventListener('input', update);
    dEl.addEventListener('change', update);
    drawGlossaryList();
  }

  function drawGlossaryList() {
    const q = glossaryState.q.trim().toLowerCase();
    const dom = glossaryState.domain;
    const list = C.glossary.terms.filter(t => {
      if (dom && !(t.domains || []).includes(dom)) return false;
      if (!q) return true;
      return [t.term, t.en, t.reading, t.def].join(' ').toLowerCase().includes(q);
    });
    const el = document.getElementById('g-list');
    if (!list.length) { el.innerHTML = '<div class="empty">該当する用語がありません。</div>'; return; }
    el.innerHTML = list.map(t => `
      <div class="term">
        <div class="t">${esc(t.term)}${t.en ? `<span class="en">${esc(t.en)}</span>` : ''} ${statusBadge(t.status)}</div>
        <div class="d">${t.def}</div>
        <div class="rel">${(t.domains || []).map(id => id === 'general' ? '共通' : `D${domainById(id).no} ${esc(domainById(id).short)}`).join(' / ')}${t.refs && t.refs.length ? ' · ' + srcLinks(t.refs) : ''}</div>
      </div>`).join('');
  }

  /* ---------- クイックリファレンス ---------- */
  function renderQuickref() {
    const qr = C.quickref;
    const groups = C.exam.domains.map(d => {
      const items = qr.items.filter(i => i.domain === d.id);
      if (!items.length) return '';
      return `<div class="card">
        <div class="badge-row"><span class="badge domain">Domain ${d.no} · ${d.weight}%</span></div>
        <h2>${esc(d.nameJa)}</h2>
        ${items.map(i => `<div class="qr">
          <div class="q">${esc(i.trigger)}</div>
          <div class="pick">${i.pick}</div>
          ${i.avoid ? `<div class="avoid">${i.avoid}</div>` : ''}
        </div>`).join('')}
        <div class="btn-row"><a class="btn small ghost" href="#/textbook/${d.no}">第${d.no}章を読む</a></div>
      </div>`;
    }).join('');

    const principles = qr.principles.map(p => `<li>${p}</li>`).join('');

    app.innerHTML = `
      <div class="page-head">
        <h1>🗂 クイックリファレンス</h1>
        <div class="sub">「こう問われたら、これを選ぶ」の早見表。試験直前の見直し用です。記述時点: ${fmtDate(qr.asOf)}</div>
      </div>
      <div class="card accent">
        <h2>迷ったときの判断原則</h2>
        <ul>${principles}</ul>
        <p class="note">公式Exam Guideのサンプル問題3問(第8節)の解説から読み取れる考え方を、本サイトの言葉でまとめたものです。サンプル問題そのものは公式ガイドで確認してください。${srcLinks(['S1'])}</p>
      </div>
      ${groups}`;
  }

  /* ---------- 演習・成績(フェーズ2で実装) ---------- */
  function renderComingSoon(title, body) {
    app.innerHTML = `
      <div class="page-head"><h1>${esc(title)}</h1></div>
      <div class="card">
        <p>${body}</p>
        <div class="btn-row"><a class="btn primary" href="#/textbook">教科書を読む</a><a class="btn" href="#/">ホーム</a></div>
      </div>`;
  }

  /* ---------- ルーター ---------- */
  function route() {
    const hash = location.hash.replace(/^#\/?/, '');
    const parts = hash.split('/').filter(Boolean);
    const top = parts[0] || 'home';
    setActiveNav(top);

    // フェーズ2の画面は quiz.js が提供する
    if (C.quiz && C.quiz.ready && C.quiz.handles(top)) {
      C.quiz.render(top, parts.slice(1), app);
    } else if (top === 'home') renderHome();
    else if (top === 'textbook') parts[1] !== undefined ? renderChapter(Number(parts[1])) : renderTextbookToc();
    else if (top === 'glossary') renderGlossary();
    else if (top === 'quickref') renderQuickref();
    else if (top === 'practice') renderComingSoon('✍️ 演習', '演習機能(章別・自由演習・30問ミニ模試・苦手ドメイン・間違えた問題の復習)はフェーズ2-Aで、60問模試はフェーズ2-Bで追加予定です。');
    else if (top === 'stats') renderComingSoon('📊 成績', 'ドメイン別成績・受験履歴はフェーズ2-Aで追加予定です。');
    else renderHome();

    // 模試中以外は先頭へスクロール
    if (!(C.quiz && C.quiz.keepScroll)) window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }

  // 公開ユーティリティ(quiz.js から利用)
  C.ui = { esc, domainById, fmtDate, srcLinks, statusBadge, objTag, domainBars, route };

  document.getElementById('footer-asof').textContent =
    `記述時点: ${fmtDate(C.exam.contentAsOf)} / 基準: Exam Guide v${C.exam.guide.version}(${C.exam.guide.effective}版)`;

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
